<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#293e36">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Worqend</title>
<!--
  WORQEND · project-based business English simulation (single file)
  - 기기를 판별해 PC 화면 또는 모바일 화면 중 하나만 불러옵니다(반응형 아님). 강제: ?view=pc / ?view=mobile
  - 설정(GS_URL · Director 계정)은 스크립트 맨 위 "1. Config"
  - 이메일 평가와 NPC 답장은 규칙 기반이며 외부 AI API를 호출하지 않습니다.
-->
</head>
<body>
<template id="tpl-pc">
<style>
:root{--bg:#faf8f3;--paper:#fffefb;--ink:#252b29;--sub:#7b807c;--line:#eae6dd;--green:#455d50;--deep:#293e36;--hero:#354f42;--soft:#f0f4eb;--accent:#d4e8ad;--lime:#c7e48b;--danger:#a13d32;--warn:#8a572c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Pretendard,'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:14px}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--green)}.hide{display:none!important}:focus-visible{outline:3px solid #b1c981;outline-offset:2px}
.muted{color:var(--sub)}.tiny{font-size:12px}.pad{padding:0 4px}
.eyebrow{color:var(--green);font-weight:800;letter-spacing:.12em;font-size:10px;text-transform:uppercase}
.logo{font-size:29px;letter-spacing:-.075em;font-weight:900;text-transform:lowercase}.logo-dot{color:var(--lime)}
/* controls */
.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 14px;font-weight:650;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cfd8cf}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn.primary.danger{background:var(--danger);border-color:var(--danger);color:white}
.btn.light{background:white;color:var(--ink);border-color:white}.btn.ghost-light{background:transparent;color:white;border-color:#6f8b7c}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.btn-row.end{justify-content:flex-end}.btn-row.split{justify-content:space-between}
.tag{display:inline-flex;align-items:center;background:#eaf0df;border-radius:999px;padding:5px 9px;font-size:11px;color:#405d43;font-weight:700}
.chip{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#eef1ec;color:#4c5a53;font-size:11px;font-weight:700;margin:2px 4px 2px 0;white-space:nowrap}
.chips{margin:6px 0 10px}
.st-draft{background:#fff1d6;color:#8a572c}.st-submitted{background:#e2ecff;color:#2f4f8a}.st-reviewed{background:#e8e2fb;color:#56459a}.st-decided{background:#dff0e4;color:#2f6a45}.st-completed{background:#d9ebc6;color:#365e2b}.st-rejected{background:#f8dcd8;color:#a13d32}.st-not-started{background:#eef1ec;color:#8a938d}.st-sent{background:#d9ebc6;color:#365e2b}
.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:12px;font-weight:700;color:#5e6d66}
.field input,.field select,.field textarea,.filters select,.select-inline{border:1px solid #dbe3dd;border-radius:10px;background:white;padding:10px 11px;outline:none;width:100%}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}.compose-body{min-height:240px!important}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#638a73}
.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.error{color:var(--danger);font-size:12px;min-height:16px;line-height:1.5}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px}
/* login */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-brand{background:var(--deep);color:white;padding:clamp(35px,7vw,100px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-brand:before{content:"✳";position:absolute;right:-45px;top:7%;font-size:300px;line-height:1;color:#bfe29c;opacity:.13;pointer-events:none}
.auth-brand h1{font-size:clamp(34px,4.5vw,65px);letter-spacing:-.065em;font-weight:850;line-height:1.15;max-width:550px}
.auth-brand p{color:#d5e0d9;font-size:16px;line-height:1.8;max-width:460px}.auth-brand .tag{background:#4b6c5a;color:#e3f2e5}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:30px}.login-card{width:min(390px,100%)}.login-card h2{font-size:28px;letter-spacing:-.03em}.login-card .btn{width:100%;justify-content:center;margin-top:10px;padding:12px}
/* shell */
.shell{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--deep);color:white;padding:26px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
.sidebar .logo{padding:0 10px}.sublogo{color:#a9c3b6;font-size:10px;letter-spacing:.08em;padding:6px 10px 16px}
.project-select{width:100%;background:#35503f;color:white;border:1px solid #4d6a5a;border-radius:10px;padding:9px 10px;margin-bottom:10px}
.project-name{font-size:12px;color:#d5e3da;padding:0 10px 12px;line-height:1.5}
.nav{display:flex;flex-direction:column;gap:2px}.nav-group{font-size:10px;letter-spacing:.12em;color:#8eab9c;padding:14px 12px 6px;text-transform:uppercase;font-weight:800}
.nav button{background:transparent;color:#c9d9d0;border:0;text-align:left;border-radius:10px;padding:10px 12px;font-weight:550;display:flex;align-items:center;gap:10px}
.nav button .ico{width:16px;text-align:center;opacity:.8}.nav button.active,.nav button:hover{background:#496655;color:white}
.nav-badge{margin-left:auto;background:var(--lime);color:var(--deep);font-size:10px;font-weight:800;border-radius:9px;padding:1px 7px}
.sidebar-foot{margin-top:auto;border-top:1px solid #456153;padding-top:16px;color:#c9d9d0}.sidebar-foot strong{display:block;color:white;margin-bottom:4px}
.sidebar-foot button{margin-top:12px;background:transparent;border:1px solid #6b887a;border-radius:8px;color:white;padding:7px 10px}
.main{padding:30px clamp(20px,3.5vw,48px) 60px;max-width:1400px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:clamp(24px,2.6vw,34px);margin:5px 0 0;letter-spacing:-.04em}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sync{font-size:11px;color:var(--sub)}
/* layout */
.grid{display:grid;gap:14px;margin-bottom:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0;box-shadow:0 3px 18px rgba(37,43,41,.025);margin-bottom:12px}
.grid>.card{margin-bottom:0}
.card h3{font-size:16px;margin:6px 0 10px;line-height:1.4}.card p{line-height:1.7;margin:8px 0}
.stats .number{font-size:32px;letter-spacing:-.05em;font-weight:800;margin:10px 0 4px}.number small{font-size:14px;color:var(--sub);margin-left:2px}
.stat-label{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.hero{background:var(--hero);color:white;padding:30px;border-radius:18px;position:relative;overflow:hidden;margin-bottom:14px}
.hero:after{content:"✳";position:absolute;right:3%;bottom:-70px;font-size:230px;color:#bde08e;opacity:.16;pointer-events:none}
.hero>*{position:relative;z-index:1}.hero h2{font-size:32px;letter-spacing:-.04em;margin:10px 0}.hero p{max-width:720px;line-height:1.8;color:#dce9df}.hero .tag{background:#4b6c5a;color:#e3f2e5}
.progress{height:7px;background:#e6eee7;border-radius:20px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:#547e65;border-radius:20px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 2px 10px}.section-title h3{margin:0;font-size:16px}.section-title>div{display:flex;gap:6px;align-items:center}
.notice{background:#fff7e8;border:1px solid #ead5af;color:#76572d;padding:11px 14px;border-radius:11px;font-size:12px;line-height:1.7;margin-bottom:12px}.notice.warn{background:#fdecea;border-color:#f0c4bd;color:#8a2f25}
.note-box{border-left:3px solid #6a9483;background:#eff5f1;padding:10px 13px;line-height:1.7;border-radius:6px;margin-top:10px}.note-box strong{font-size:10px;letter-spacing:.08em;color:var(--green)}.note-box p{margin:3px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}.kv div{background:#f6f8f5;border-radius:10px;padding:10px 12px}.kv small{display:block;color:var(--sub);font-size:11px;margin-bottom:3px}.kv strong{font-size:13px;font-weight:600;line-height:1.5}
.www{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.www div{background:#f6f8f5;border-radius:10px;padding:10px 12px}.www .span2{grid-column:1/-1}.www small{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--green);margin-bottom:3px}.www b{font-weight:600;line-height:1.6}.www span{line-height:1.6}
.role-card .role-title{font-size:26px;letter-spacing:-.03em;margin:6px 0 4px}
.brief.new{border-color:#c3dba5;background:#fbfdf6}
/* lists */
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 16px;min-height:52px}
.row:last-child{border-bottom:0}button.row:hover{background:#f6f8f4}.row.inactive{opacity:.5}
.row-main{flex:1;min-width:0}.row-main b{display:block;font-size:14px;font-weight:650}.row-main span{display:block;font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
.row-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.avatar{width:36px;height:36px;border-radius:11px;background:#e6ede6;color:#365e51;display:grid;place-items:center;font-weight:850;font-size:12px;flex:none}.avatar.ext{background:#f3eee2;color:#8a572c}.avatar.big{width:48px;height:48px;font-size:16px}
.empty{padding:22px 16px;text-align:center;color:var(--sub);font-size:13px}
.list-row{padding:10px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border:0}.list-row p{margin:4px 0 0;color:var(--sub);font-size:13px;line-height:1.6}
details.card summary,details summary{cursor:pointer;font-weight:700;padding:2px 0}
.seg{display:inline-flex;background:#efece4;border-radius:11px;padding:3px}.seg button{border:0;background:transparent;border-radius:8px;padding:7px 14px;font-weight:700;color:var(--sub)}.seg button.active{background:white;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.filters{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.filters select{width:auto;min-width:260px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{font-size:11px;color:var(--sub);font-weight:800}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}.matrix .cur{background:#f3f8ec}
.cell{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;margin:1px}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}.spark i{display:block;width:7px;background:#7fa08b;border-radius:2px}
table.mini td{font-size:12px;padding:6px}
/* org */
.org{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}.org-top{display:flex;justify-content:center;margin-bottom:16px}
.org-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.org-group{background:#f6f8f5;border-radius:14px;padding:12px}.org-group-title{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--green);margin-bottom:8px;text-transform:uppercase}
.org-node{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.org-node small{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}.org-node b{font-size:13px}
.org-node.director{background:var(--deep);color:white;border:0;min-width:240px;text-align:center}.org-node.director small{color:#a9c3b6}.org-node.fn-approver{border-color:#9fc29b;background:#f4faf0}.org-node.fn-coordinator{border-color:#c2b8ea;background:#f7f5fd}
/* timeline */
.timeline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.timeline .card{margin:0}.tl-head{display:flex;justify-content:space-between;align-items:center}.tl.current{border-color:#a9c98f;box-shadow:0 0 0 3px #eef6e5}.tl.completed{opacity:.8}
/* mail */
.mail-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mail-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px}
.mail-list{background:white;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:72vh}
.mail-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:white;padding:12px 14px}
.mail-item.selected{background:var(--soft);box-shadow:inset 3px 0 0 var(--green)}.mail-item .row-right{flex-direction:column;align-items:flex-end;gap:4px}.mail-item small{font-size:11px;color:var(--sub);white-space:nowrap}
.mail-view{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;min-height:420px;min-width:0}.mail-view h3{font-size:20px;margin:0 0 12px}
.mail-head{font-size:12px;color:var(--sub);line-height:1.8}
.mail-body,.pre{white-space:pre-wrap;line-height:1.8;word-break:break-word}.mail-body{border-top:1px solid var(--line);padding-top:16px;margin-top:14px}.pre{background:#f7f9f6;border-radius:10px;padding:10px 12px;margin:6px 0}
.assess-mini{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.recent{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-4px 0 6px}.recent small{font-size:11px;color:var(--sub);font-weight:700;margin-right:2px}
.pill{border:1px solid #d6e2d4;background:#f4f8f1;color:#365e51;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
/* assessment */
.assess{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;background:#fcfdfb}
.assess-head{display:flex;gap:16px;align-items:center}.assess-score{font-size:42px;font-weight:850;color:var(--green);letter-spacing:-.04em}.assess-score small{font-size:15px;color:var(--sub);font-weight:600}
.grade{font-size:16px}.g-excellent{color:#2f6a45}.g-proficient{color:#3d6e5a}.g-developing{color:#8a6a2c}.g-needs-improvement{color:#a85a2c}.g-revision-required{color:var(--danger)}
.cat-bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin:12px 0}.cat-label{display:flex;justify-content:space-between;font-size:12px}.cat .progress{margin-top:4px}
.delta{font-size:11px;margin-left:5px;color:var(--sub)}.delta.up{color:#2f7a45}.delta.down{color:var(--danger)}
.assess h4{margin:12px 0 4px;font-size:13px}.assess ul{margin:0;padding-left:18px;line-height:1.7;font-size:13px}.assess ul.missing li{color:#8a2f25}.assess ul.met li{color:#2f5e3c}.assess ul.flags li{color:#6a4fb0}
.version{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
/* meetings */
.part-table{border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-height:240px;overflow:auto}.part-row{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;padding:5px 0;border-bottom:1px solid #f0ede6}.part-row:last-child{border:0}
.dyn-row{display:grid;grid-template-columns:1fr 190px 150px auto auto;gap:6px;margin-bottom:6px;align-items:center}.dyn-row[data-kind=dec]{grid-template-columns:1fr 190px 150px auto}.dyn-row input,.dyn-row select{border:1px solid #dbe3dd;border-radius:8px;padding:8px;width:100%}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:white;display:grid;place-items:center;padding:0}
/* chat */
.chat{height:380px;overflow:auto;background:#f6f8f5;border-radius:12px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:78%;padding:9px 12px;border-radius:14px;line-height:1.55;font-size:13.5px}.bubble small{display:block;font-size:10px;opacity:.6;margin-top:3px}.bubble.me{align-self:flex-end;background:var(--green);color:white;border-bottom-right-radius:4px}.bubble.npc{align-self:flex-start;background:white;border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-form{display:flex;gap:8px}.chat-form input{flex:1;border:1px solid #dbe3dd;border-radius:10px;padding:10px}
/* dropzone */
.dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #b9cdb7;border-radius:16px;padding:34px;background:#f7faf4;cursor:pointer;text-align:center}.dropzone:hover{background:#f0f6ea}.dz-icon{font-size:28px;color:var(--green)}
body.dragging:after{content:"⬆  Drop the project Excel file to import";position:fixed;inset:12px;border:3px dashed var(--green);border-radius:20px;background:rgba(240,246,234,.92);display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--green);z-index:50}
/* overlay */
.modal{position:fixed;inset:0;background:#0c1c17a3;display:grid;place-items:center;padding:20px;z-index:20}
.modal-box{background:white;border-radius:18px;width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column}.modal.wide .modal-box{width:min(900px,100%)}
.overlay-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}.overlay-head h2{margin:0;font-size:18px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#overlayBody{padding:18px 20px 22px;overflow:auto}#overlayBody h4{margin:16px 0 6px}
.dialog{position:fixed;inset:0;z-index:40;background:rgba(12,28,23,.5);display:grid;place-items:center;padding:20px}.dialog-box{background:white;border-radius:18px;padding:22px;width:min(400px,100%)}.dialog-box h3{margin:0 0 8px}.dialog-box p{white-space:pre-line;line-height:1.7;margin:0}
.me-card{display:flex;gap:12px;align-items:center}.chev{color:#b7bfb9}
@media(min-width:1100px){.main{padding-top:36px}}
@media(max-width:1000px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.mail-layout{grid-template-columns:260px 1fr}.timeline{grid-template-columns:1fr}}
@media(max-width:760px){.shell{grid-template-columns:minmax(0,1fr)}.sidebar{position:relative;height:auto}.g2,.g3,.field-row,.www,.cat-bars{grid-template-columns:1fr}.mail-layout{grid-template-columns:1fr}.auth{grid-template-columns:1fr}}

.wallet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.wallet-head b{display:block;font-size:14px;margin-top:4px}.wallet-avail{text-align:right}.wallet-avail small{display:block;font-size:11px;color:var(--sub)}.wallet-avail strong{font-size:22px;letter-spacing:-.03em;color:var(--green)}
.wallet-card.mine{border-color:#a9c98f;box-shadow:0 0 0 3px #eef6e5}
.wbar{display:flex;height:10px;border-radius:10px;overflow:hidden;background:#eef1ec;margin:12px 0}.wbar i{display:block;height:100%}.wbar .actual{background:#455d50}.wbar .committed{background:#c9a35a}.wbar .avail{background:#bcd9a4}
.wnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wnums div{background:#f6f8f5;border-radius:10px;padding:8px 10px}.wnums small{display:block;font-size:10.5px;color:var(--sub)}.wnums b{font-size:13px}
.alloc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 12px}
.xfer-box{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:#f6f8f5;border-radius:12px;padding:12px;margin:10px 0}.xfer-box small{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--green)}.xfer-box span{display:block;font-size:11px;color:var(--sub)}.xfer-arrow{font-weight:800;color:var(--green);text-align:center}

<script>
'use strict';
/* ── 1. Config ──────────────────────────────────────────── */
const CONFIG = {
  GS_URL: 'https://script.google.com/macros/s/AKfycbyhD1Jzqq2SaUFWQAOFUtUYI3gmsuX2FLNk77VWRDMvKw66AXXTrN99T902rreLfJZL/exec', // Code.gs 웹 앱 URL. 비우면 이 브라우저(localStorage)에만 저장(테스트용)
  REFRESH_TTL: 15000,         // 화면 이동 시 최대 15초마다 자동 동기화
  MAX_UPLOAD: 2 * 1024 * 1024,
  XLSX_LIB: 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'
};

/* 총괄 Director 계정 (참가자 8명에 포함되지 않음 · 화면에서 삭제 불가) */
const DIRECTOR = { id: 'director-harry', loginId: 'harry', name: 'Harry Jeong', role: 'director', email: 'harry@worqend.com', password: 'harryjeong', active: true };

/* 초기 참가자 계정 (선택). 예: { loginId:'pm01', name:'Sarah Kim', projectId:'morrow-tumbler-s1', role:'pm', password:'changeme' } */
const SEED_ACCOUNTS = [];

const STATUSES = ['Draft', 'Submitted', 'Reviewed', 'Decided', 'Completed'];
const ITEM_KINDS = {
  request: { label: 'Information request', ko: '정보 요청' },
  report: { label: 'Progress report', ko: '진행 보고' },
  approval: { label: 'Approval request', ko: '승인 요청 (방향 변경 등)' },
  reallocation: { label: 'Budget transfer request', ko: '예산 이전 기안 (Wallet → Wallet)' },
  director_report: { label: 'Report to Director', ko: 'Director 보고' }
};

/* ── 3. Utilities ──────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const fmt = ts => ts ? new Date(ts).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' }) : '';
const fmtDay = d => { if (!d) return ''; const x = new Date(d); return isNaN(x) ? String(d) : x.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' }); };
const pad2 = n => String(n).padStart(2, '0');
const norm = s => String(s ?? '').trim().toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s || '').trim());
function downloadBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

/* ── 4. Storage (local or Google Apps Script) ──────────── */
const COLLECTIONS = ['projects', 'accounts', 'mails', 'items', 'meetings', 'deliverables', 'events', 'reviews', 'settings', 'assessments', 'npcstates', 'chats', 'ledger', 'purchases'];
const LOCAL_KEY = 'worqend_local_v1';

const LocalStore = {
  mode: 'local',
  _read() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch (_) { return {}; } },
  async sync() { const d = this._read(); return Object.fromEntries(COLLECTIONS.map(c => [c, d[c] || []])); },
  async write(ops) {
    const d = this._read();
    for (const o of ops) {
      const list = d[o.c] = d[o.c] || [];
      if (o.op === 'put') { const i = list.findIndex(r => r.id === o.r.id); i >= 0 ? (list[i] = o.r) : list.push(o.r); }
      if (o.op === 'remove') d[o.c] = list.filter(r => r.id !== o.id);
    }
    localStorage.setItem(LOCAL_KEY, JSON.stringify(d));
  },
  async files() { throw Error('파일 업로드는 Google Apps Script(GS_URL) 연결 후 사용할 수 있습니다.'); }
};

const RemoteStore = {
  mode: 'remote',
  async call(body) {
    const res = await fetch(CONFIG.GS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    if (!res.ok) throw Error('서버 응답 오류 (' + res.status + ')');
    const out = await res.json();
    if (!out.ok) throw Error(out.error || '서버 오류');
    return out.data;
  },
  sync() { return this.call({ action: 'sync', collections: COLLECTIONS }); },
  write(ops) { return this.call({ action: 'write', ops }); },
  files(action, params = {}) { return this.call({ action: 'files.' + action, ...params }); }
};

const Store = CONFIG.GS_URL ? RemoteStore : LocalStore;

/* ── 5. State & selectors ──────────────────────────────── */
const db = Object.fromEntries(COLLECTIONS.map(c => [c, []]));
let me = null;
let lastSync = 0, syncing = null;
const hooks = { status: () => {}, changed: () => {}, signedOut: () => {} };

/* Projects */
const allProjects = () => {
  const stored = db.projects.filter(p => !p.deleted);
  const ids = new Set(db.projects.map(p => p.id));
  return [...BUILTIN_PROJECTS.filter(p => !ids.has(p.id)), ...stored];
};
const projectById = id => allProjects().find(p => p.id === id);
const PROJECT_KEY = 'worqend_project';
const isDirector = () => me?.role === 'director';
function currentProjectId() {
  if (!me) return null;
  if (isDirector()) { const s = sessionStorage.getItem(PROJECT_KEY); return projectById(s) ? s : allProjects()[0]?.id || null; }
  return projectById(me.projectId) ? me.projectId : null;
}
const project = () => projectById(currentProjectId());
const inProject = r => r.projectId === currentProjectId();

/* Roles & people */
const roleDef = (key, p = project()) => p?.roles.find(r => r.key === key);
const roleTitle = (key, p) => key === 'director' ? 'Director' : roleDef(key, p)?.title || key || '—';
const myRole = () => isDirector() ? null : roleDef(me?.role);
const isPM = () => myRole()?.function === 'approver';
const isCoord = () => myRole()?.function === 'coordinator';
const canLead = () => isPM() || isCoord() || isDirector();
const accounts = () => [DIRECTOR, ...db.accounts.filter(a => a.id !== DIRECTOR.id)];
const accountById = id => accounts().find(a => a.id === id);
const members = (pid = currentProjectId(), includeInactive = false) => db.accounts.filter(a => a.projectId === pid && a.id !== DIRECTOR.id && (includeInactive || a.active !== false));
const membersOfRole = key => members().filter(a => a.role === key);
const roleHolder = fn => members().find(a => roleDef(a.role)?.function === fn);
const roleLabel = (a = me) => a?.role === 'director' ? 'Director' : roleTitle(a?.role, projectById(a?.projectId));
const nameOf = id => accountById(id)?.name || '—';
const initials = name => String(name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();

/* Weeks */
const week = () => Number(db.settings.find(s => s.id === 'week:' + currentProjectId())?.week) || 1;
const weeksCount = () => project()?.weeksCount || project()?.weeks.length || 8;
const weekDef = (n = week()) => project()?.weeks.find(w => w.week === n);
function weekDue(n) {
  const p = project();
  if (!p?.startDate) return null;
  const d = new Date(p.startDate); if (isNaN(d)) return null;
  d.setDate(d.getDate() + (n - 1) * 7 + 6);
  return d;
}
const dueLabel = n => { const d = weekDue(n); return d ? `${fmtDay(d)} · end of W${n}` : `End of Week ${n}`; };

/* Missions, briefs, deliverables */
const missionsFor = (role, n) => (project()?.missions || []).filter(m => m.week === n && (m.role === role || m.role === 'all'));
const briefsFor = (role, upTo) => (project()?.briefs || []).filter(b => b.week <= upTo && (b.role === role || b.role === 'all')).sort((a, b) => b.week - a.week);
/** 산출물 정의를 역할별 개별 제출 단위로 펼침 (role 'all' → 프로젝트 역할마다 1건) */
function deliverableSlots(n) {
  const p = project(); if (!p) return [];
  return (p.deliverables || []).filter(d => n == null || d.week === n).flatMap(d => {
    const roles = d.role === 'all' ? p.roles.map(r => r.key) : [d.role];
    return roles.map(role => ({ ...d, role, key: `${d.week}|${slug(d.title)}|${role}` }));
  });
}
const deliverableId = key => currentProjectId() + '|' + key;
const deliverableRecord = key => db.deliverables.find(r => r.id === deliverableId(key));
const deliverableStatus = key => deliverableRecord(key)?.status || 'Not started';
const slotByKey = key => deliverableSlots().find(s => s.key === key);

/* Mail (CC · 휴지통 · 최근 수신자 · 답장 지연) */
const pmails = () => db.mails.filter(inProject);
const visibleNow = m => (m.deliverAt || m.ts) <= Date.now();
const deletedForMe = m => (m.deletedBy || []).includes(me.id);
const purgedForMe = m => (m.purgedBy || []).includes(me.id);
const isToMe = m => norm(m.to) === norm(me.email) || (m.cc || []).map(norm).includes(norm(me.email));
const inbox = () => pmails().filter(m => isToMe(m) && visibleNow(m) && !deletedForMe(m)).sort((a, b) => (b.deliverAt || b.ts) - (a.deliverAt || a.ts));
const sent = () => pmails().filter(m => norm(m.from) === norm(me.email) && !deletedForMe(m)).sort((a, b) => b.ts - a.ts);
const trash = () => pmails().filter(m => (isToMe(m) && visibleNow(m) || norm(m.from) === norm(me.email)) && deletedForMe(m) && !purgedForMe(m)).sort((a, b) => b.ts - a.ts);
const stakeholders = () => project()?.stakeholders || [];
const stakeholderByEmail = e => stakeholders().find(s => norm(s.email) === norm(e));
const npcConfig = e => (project()?.npcs || {})[norm(e)] || null;
const displayName = email => { const e = norm(email); return accounts().find(a => norm(a.email) === e)?.name || stakeholderByEmail(e)?.name || email; };
const contactList = () => [...new Set([DIRECTOR.email, ...members().map(a => a.email), ...stakeholders().map(s => s.email)].map(norm))].filter(e => e !== norm(me.email));
/** 내가 보낸 적 있는 주소(To·CC) — 최근 순 */
function recentRecipients(limit = 8) {
  const seen = []; for (const m of pmails().filter(m => norm(m.from) === norm(me.email)).sort((a, b) => b.ts - a.ts)) for (const e of [m.to, ...(m.cc || [])].map(norm)) if (e && !seen.includes(e) && contactList().includes(e)) seen.push(e);
  return seen.slice(0, limit);
}
const parseAddressList = s => [...new Set(String(s || '').split(/[,;\s]+/).map(norm).filter(Boolean))];
const mailAssessment = mailId => db.assessments.find(a => a.mailId === mailId && a.final);

/* Items (requests / reports / approvals) */
const pitems = () => db.items.filter(inProject);
const itemById = id => db.items.find(i => i.id === id);
const myItems = () => pitems().filter(i => i.authorId === me.id).sort((a, b) => b.updated - a.updated);
const coordinatorExists = () => !!roleHolder('coordinator');
/** PM이 결정해야 할 항목: Coordinator가 전달한 것 (Coordinator가 없으면 제출된 것) */
const pmQueue = () => pitems().filter(i => i.kind !== 'director_report' && (i.status === 'Reviewed' || (i.status === 'Submitted' && !coordinatorExists()))).sort((a, b) => a.updated - b.updated);
const directorReports = () => pitems().filter(i => i.kind === 'director_report').sort((a, b) => b.updated - a.updated);

/* Meetings, decisions, action items */
const pmeetings = () => db.meetings.filter(inProject).sort((a, b) => b.week - a.week || (b.date || '').localeCompare(a.date || ''));
const meetingById = id => db.meetings.find(m => m.id === id);
function decisionLog() {
  const fromMeetings = pmeetings().flatMap(m => (m.decisions || []).map(d => ({ ...d, source: m.title, week: m.week, ts: m.updated })));
  const fromItems = pitems().filter(i => i.decision).map(i => ({ text: `${i.decision.result}: ${i.title}`, owner: i.authorId, due: i.due, note: i.decision.note, source: ITEM_KINDS[i.kind]?.label, week: i.week, ts: i.decision.at }));
  return [...fromMeetings, ...fromItems].sort((a, b) => (b.ts || 0) - (a.ts || 0));
}
const actionItems = () => pmeetings().flatMap(m => (m.actions || []).map((a, idx) => ({ ...a, meetingId: m.id, idx, week: m.week, source: m.title })));

/* Wallet (가상 예산) */
const walletKeys = () => WalletEngine.walletRoles(project());
const pledger = () => db.ledger.filter(inProject).sort((a, b) => b.ts - a.ts);
const ppurchases = () => db.purchases.filter(inProject).sort((a, b) => b.ts - a.ts);
const walletBalances = () => WalletEngine.balances(db.ledger.filter(inProject), project());
const myWalletKey = () => !isDirector() && walletKeys().includes(me?.role) ? me.role : null;
const canSeeAllWallets = () => isPM() || isDirector();
const projectBudget = () => { const s = db.settings.find(x => x.id === 'budget:' + currentProjectId()); return Number(s?.budget ?? project()?.budget ?? 0); };
const walletsInitialized = () => db.ledger.some(inProject);
async function walletOp(op, args) {
  const p = requireProject();
  const opArgs = { ...args, opId: args.opId || uid() };
  if (Store.mode === 'remote') {
    await Store.call({ action: 'wallet.op', projectId: p.id, op, args: opArgs, userId: me.id });
    await sync(); hooks.changed(); return;
  }
  const actor = { id: me.id, role: me.role, isDirector: isDirector(), function: myRole()?.function };
  const r = WalletEngine.plan(op, opArgs, { project: p, ledger: db.ledger.filter(inProject), purchases: db.purchases.filter(inProject), items: pitems(), actor, budget: projectBudget() });
  const ops = r.ledger.map(e => ({ op: 'put', c: 'ledger', r: e }));
  if (r.purchase) ops.push({ op: 'put', c: 'purchases', r: r.purchase });
  if (r.item) ops.push({ op: 'put', c: 'items', r: r.item });
  if (r.settings) ops.push({ op: 'put', c: 'settings', r: { id: 'budget:' + p.id, projectId: p.id, budget: r.settings.budget } });
  await commit(ops);
}

/* Evaluation */
const evalDims = () => project()?.evaluation?.length ? project().evaluation : MORROW.evaluation;
const reviewOf = userId => db.reviews.find(r => r.id === `${currentProjectId()}|${userId}`);
function weightedScore(r) {
  if (!r) return null;
  const dims = evalDims(); const total = dims.reduce((s, d) => s + Number(d.weight || 0), 0) || 1;
  return Math.round(dims.reduce((s, d) => s + (Number(r.scores?.[d.dimension]) || 0) / 5 * Number(d.weight || 0), 0) / total * 100);
}

/* ── Sync ── */
async function sync() {
  if (syncing) return syncing;
  hooks.status('동기화 중…');
  syncing = (async () => {
    const data = await Store.sync();
    for (const c of COLLECTIONS) db[c] = Array.isArray(data[c]) ? data[c] : [];
    lastSync = Date.now();
    if (me && !isDirector()) { const fresh = accountById(me.id); if (!fresh || fresh.active === false) { signOut(); return; } me = fresh; }
    hooks.status((Store.mode === 'local' ? '로컬 · ' : '') + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }));
  })().catch(e => { hooks.status('동기화 실패'); throw e; }).finally(() => { syncing = null; });
  return syncing;
}
const isStale = () => Date.now() - lastSync > CONFIG.REFRESH_TTL;
async function commit(ops) { await Store.write(ops); await sync(); if (me) hooks.changed(); }
async function seedAccounts() {
  const ops = SEED_ACCOUNTS.filter(s => !accounts().some(a => norm(a.loginId) === norm(s.loginId)))
    .map(s => ({ op: 'put', c: 'accounts', r: { id: uid(), active: true, created: Date.now(), ...s, loginId: norm(s.loginId), email: norm(s.email || s.loginId + '@worqend.com') } }));
  if (ops.length) { await Store.write(ops); await sync(); }
}

/* ── 6. Session ── */
const SESSION_KEY = 'worqend_user';
function signIn(idOrEmail, pw) {
  const key = norm(idOrEmail);
  const u = accounts().find(a => (norm(a.loginId) === key || norm(a.email) === key) && a.password === pw && a.active !== false);
  if (!u) return null;
  me = u; sessionStorage.setItem(SESSION_KEY, u.id); return u;
}
function signOut() { me = null; sessionStorage.removeItem(SESSION_KEY); hooks.signedOut(); }
async function boot() {
  await sync(); await seedAccounts();
  const u = accountById(sessionStorage.getItem(SESSION_KEY));
  if (u && u.active !== false) { me = u; return u; }
  return null;
}
function setActiveProject(id) { if (isDirector() && projectById(id)) { sessionStorage.setItem(PROJECT_KEY, id); hooks.changed(); } }

/* ── 7. Domain actions ─────────────────────────────────── */
function requireProject() { const p = project(); if (!p) throw Error('배정된 프로젝트가 없습니다. Director에게 문의하세요.'); return p; }

/* Mail */
function recipientContext(to) {
  const e = norm(to);
  const acc = accounts().find(a => norm(a.email) === e);
  const sh = stakeholderByEmail(e);
  const rf = acc && acc.role !== 'director' ? roleDef(acc.role)?.function : null;
  const names = [...members().map(a => a.name), ...stakeholders().map(x => x.name), DIRECTOR.name].flatMap(n => [n, n.split(' ')[0]]);
  return {
    internal: !!acc, recipientRole: acc ? acc.role : sh ? 'external' : '', recipientFunction: acc?.role === 'director' ? 'director' : rf || '',
    recipientType: sh?.type || '', senderName: me.name, senderFunction: isDirector() ? 'director' : myRole()?.function || 'member',
    coordinatorExists: coordinatorExists(), knownNames: [...new Set(names)]
  };
}
const emailMissions = () => project()?.emailMissions || [];
const missionById = id => emailMissions().find(m => m.mission_id === id) || null;
const myEmailMissions = () => emailMissions().filter(m => (isDirector() || m.sender_role === me.role) && m.week <= week()).sort((a, b) => b.week - a.week);
function replyDraft(mailId, all) {
  const ref = db.mails.find(m => m.id === mailId); if (!ref) return null;
  const mine = norm(me.email);
  const to = norm(ref.from) === mine ? ref.to : ref.from;

/* Items workflow: Draft → Submitted → Reviewed (forwarded) → Decided → Completed */
function itemLog(item, action, note) { return [...(item.history || []), { at: Date.now(), by: me.id, action, note: note || '' }]; }
async function saveItem(fields, submit, existingId) {
  const p = requireProject();
  const old = existingId && itemById(existingId);
  if (old && old.authorId !== me.id) throw Error('작성자만 수정할 수 있습니다.');
  const title = String(fields.title || '').trim(), body = String(fields.body || '').trim();
  if (!title) throw Error('무엇(What)을 입력하세요.');
  if (submit && !body) throw Error('제출하려면 이유·내용(Why)을 입력하세요.');
  const kind = ITEM_KINDS[fields.kind] ? fields.kind : 'request';
  if (kind === 'director_report' && !isPM()) throw Error('Director 보고는 PM만 작성합니다.');
  const now = Date.now();
  const base = old || { id: uid(), projectId: p.id, authorId: me.id, created: now, history: [] };
  const rec = { ...base, kind, title, body, due: fields.due || '', relatedRole: fields.relatedRole || '', amount: fields.amount || '', week: Number(fields.week) || week(), updated: now, status: submit ? 'Submitted' : 'Draft', returnNote: submit ? '' : (old?.returnNote || '') };
  if (kind === 'reallocation') {
    const roles = walletKeys();
    const amt = Math.round(Number(String(fields.amountValue || '').replace(/[^\d.]/g, '')));
    if (!roles.includes(fields.fromWallet) || !roles.includes(fields.toWallet)) throw Error('보내는 Wallet과 받는 Wallet을 선택하세요.');
    if (fields.fromWallet === fields.toWallet) throw Error('같은 Wallet끼리는 이전할 수 없습니다.');
    if (!(amt > 0)) throw Error('이전 금액을 입력하세요.');
    if (submit && !String(fields.agreement || '').trim()) throw Error('누구와 어떻게 합의했는지(미팅·메시지) 적어주세요.');
    Object.assign(rec, { fromWallet: fields.fromWallet, toWallet: fields.toWallet, amountValue: amt, amount: WalletEngine.won(amt), meetingId: fields.meetingId || '', agreement: String(fields.agreement || '').trim(), relatedRole: fields.fromWallet });
  }
  rec.history = itemLog(base, submit ? 'Submitted' : 'Saved draft');
  await commit([{ op: 'put', c: 'items', r: rec }]);
  return rec;
}
async function transitionItem(id, action, note = '') {
  const it = itemById(id); if (!it) throw Error('항목을 찾을 수 없습니다.');
  note = String(note || '').trim();
  const t = { status: it.status };
  switch (action) {
    case 'forward': if (!isCoord() || it.status !== 'Submitted') throw Error('Coordinator만 제출된 항목을 PM에게 전달할 수 있습니다.'); t.status = 'Reviewed'; t.coordinatorNote = note; break;
    case 'return': if (!(isCoord() || isPM()) || !['Submitted', 'Reviewed'].includes(it.status)) throw Error('반려할 수 없는 상태입니다.'); if (!note) throw Error('보완할 내용을 적어주세요.'); t.status = 'Draft'; t.returnNote = note; break;
    case 'close': if (!isCoord() || it.status !== 'Submitted') throw Error('Coordinator만 처리할 수 있습니다.'); t.status = 'Completed'; t.coordinatorNote = note; break;
    case 'approve': case 'reject': case 'note':
      if (!isPM() || !pmQueue().some(x => x.id === id)) throw Error('PM 결정 대기 항목이 아닙니다.');
      if (action !== 'note' && !note) throw Error('결정 사유를 적어주세요.');
      if (action === 'approve' && it.kind === 'reallocation') { const b = walletBalances()[it.fromWallet]; if (!b || b.available < it.amountValue) throw Error(`보내는 Wallet(${roleTitle(it.fromWallet)})의 가용액 ${WalletEngine.won(b?.available || 0)} 이 부족해 승인할 수 없습니다.`); }
      t.status = 'Decided'; t.decision = { result: { approve: 'Approved', reject: 'Rejected', note: 'Noted' }[action], note, by: me.id, at: Date.now() }; break;
    case 'complete': if (!(isCoord() || (isPM() && !coordinatorExists())) || it.status !== 'Decided') throw Error('결정 전달 후 완료 처리는 Coordinator가 합니다.'); t.status = 'Completed'; t.closeNote = note; break;
    case 'director-review': if (!isDirector() || it.kind !== 'director_report') throw Error('Director만 처리할 수 있습니다.'); t.status = 'Reviewed'; t.directorFeedback = note; break;
    case 'delete': if (it.authorId !== me.id || it.status !== 'Draft') throw Error('작성자의 Draft만 삭제할 수 있습니다.'); await commit([{ op: 'remove', c: 'items', id }]); return;
    default: throw Error('Unknown action');
  }
  await commit([{ op: 'put', c: 'items', r: { ...it, ...t, updated: Date.now(), history: itemLog(it, action, note) } }]);
  if (action === 'approve' && it.kind === 'reallocation') {
    try { await walletOp('transfer', { itemId: id, opId: 'xfer-' + id }); }
    catch (e) { const cur = itemById(id); if (cur) await commit([{ op: 'put', c: 'items', r: { ...cur, transferError: e.message } }]); throw Error('승인은 기록됐지만 이전이 실행되지 않았습니다: ' + e.message); }
  }
}
function coordinatorStatusDraft() {
  const w = week();
  const slots = deliverableSlots().filter(s => s.week <= w);
  const missing = slots.filter(s => !['Submitted', 'Reviewed', 'Completed'].includes(deliverableStatus(s.key)));
  const waiting = pitems().filter(i => i.status === 'Submitted').length;
  const atPM = pmQueue().length;
  return {
    kind: 'report', title: `Week ${w} status update`,
    body: `Week ${w} — ${weekDef(w)?.title || ''}\n\nDeliverables: ${slots.length - missing.length}/${slots.length} submitted.\n${missing.length ? 'Missing:\n' + missing.map(s => `• ${s.title} — ${roleTitle(s.role)} (${membersOfRole(s.role).map(a => a.name).join(', ') || 'unassigned'})`).join('\n') : 'Nothing missing.'}\n\nOpen requests waiting for review: ${waiting}\nItems waiting for PM decision: ${atPM}\n\nKey decision this week: ${weekDef(w)?.decision || ''}`
  };
}

async function reviewDeliverable(key, action, note = '') {
  const r = deliverableRecord(key); if (!r) throw Error('제출된 버전이 없습니다.');
  note = String(note || '').trim();
  let status;
  if (action === 'reviewed') { if (!canLead()) throw Error('권한이 없습니다.'); status = 'Reviewed'; }
  else if (action === 'return') { if (!canLead()) throw Error('권한이 없습니다.'); if (!note) throw Error('보완할 내용을 적어주세요.'); status = 'Draft'; }
  else if (action === 'complete') { if (!(isPM() || isDirector())) throw Error('PM 또는 Director만 완료 처리합니다.'); status = 'Completed'; }
  else throw Error('Unknown action');

}

}

/* Accounts */
function buildAccount(f, existing) {
  const loginId = norm(f.loginId);
  const email = norm(f.email) || loginId + '@worqend.com';
  const name = String(f.name || '').trim();
  const p = projectById(f.projectId);
  if (!name) throw Error('이름을 입력하세요.');
  if (!/^[a-z0-9_.\-]{3,30}$/.test(loginId)) throw Error('아이디는 영문·숫자·_ . - 조합 3~30자로 입력하세요.');
  if (String(f.password || '').length < 4) throw Error('비밀번호는 4자 이상 입력하세요.');
  if (!p) throw Error('프로젝트를 선택하세요.');
  if (!roleDef(f.role, p)) throw Error('이 프로젝트의 역할을 선택하세요.');
  if (!isEmail(email)) throw Error('이메일 형식을 확인하세요.');
  const rec = { ...(existing || { id: uid(), created: Date.now(), active: true }), name, loginId, email, password: String(f.password), projectId: p.id, role: f.role };
  const others = accounts().filter(a => a.id !== rec.id);
  if (others.some(a => norm(a.loginId) === loginId)) throw Error('이미 사용 중인 아이디입니다: ' + loginId);
  if (others.some(a => norm(a.email) === email)) throw Error('이미 사용 중인 이메일입니다: ' + email);
  if (allProjects().some(pp => (pp.stakeholders || []).some(s => norm(s.email) === email))) throw Error('가상 거래처 이메일은 계정으로 쓸 수 없습니다.');
  return rec;
}
async function createAccount(f) { const r = buildAccount(f); await commit([{ op: 'put', c: 'accounts', r }]); return r; }
async function updateAccount(id, f) {
  const old = db.accounts.find(x => x.id === id); if (!old) throw Error('계정을 찾을 수 없습니다.');
  const r = buildAccount(f, old);
  const ops = [{ op: 'put', c: 'accounts', r }];

    if (a || b) ops.push({ op: 'put', c: 'mails', r: { ...m, from: a ? r.email : m.from, to: b ? r.email : m.to } });
  }
  await commit(ops); return r;
}

async function listFiles() { if (Store.mode === 'local') throw Error('로컬 테스트 모드에서는 파일 업로드를 쓸 수 없습니다. GS_URL 연결 후 사용하세요.'); return Store.files('list'); }
async function uploadFile(file) {
  if (!file) return null;
  if (Store.mode === 'local') throw Error('파일 업로드는 GS_URL 연결 후 사용할 수 있습니다. 지금은 링크로 제출하세요.');
  if (file.size > CONFIG.MAX_UPLOAD) throw Error('파일은 최대 2 MB까지 올릴 수 있습니다.');
  const base64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(file); });
  return Store.files('upload', { fileName: file.name, mimeType: file.type, base64, ownerId: me.id });
}
async function downloadFile(id, name) {
  const r = await Store.files('download', { fileId: id });
  downloadBlob(new Blob([Uint8Array.from(atob(r.base64), c => c.charCodeAt(0))], { type: r.mimeType || 'application/octet-stream' }), name);
}
function exportData() { downloadBlob(new Blob([JSON.stringify({ exported: new Date().toISOString(), ...db }, null, 2)], { type: 'application/json' }), 'worqend-export.json'); }

      approvalRef: /\b(approved by|(pm|ceo|manager|director) (has )?approved|with (pm|the pm's|management) approval|pending (approval|pm approval)|subject to (approval|pm approval|internal approval)|once (approved|we get approval|it is approved)|after approval|internal approval)\b/i,
      negation: /\b(not|no|never|without|n't|cannot|can't|won't|don't|doesn't|didn't)\b/i,
      html: /<\/?[a-z][a-z0-9]*(\s[^>]*)?>/i,
      hangul: /[ㄱ-ㆎ가-힣]/
    },

    inappropriate: {
      always: [/\b(stupid|idiot|wtf|damn|shut up|whatever|ridiculous|useless|obviously you)\b/i, /\b(you should have known|it's your fault|not my problem)\b/i],
      external: [/\b(gonna|wanna|gotta|yeah|yep|nope|hey guys|lol|btw|pls|plz|thx|thanx)\b/i, /(^|\s)(u|ur|r)(\s|$)/i, /[😀-🙏🤣🥲😂👍🙌❤️✨🔥]/u]
    },

    /** 사전 정의된 오류 패턴 — 단정하기 어려운 문법은 넣지 않습니다 */
    errorPatterns: [
      { re: /\bdiscuss about\b/i, fix: '“discuss about” → “discuss”' },
      { re: /\b(could|can|would|will) you (please )?to\b/i, fix: '“could you to …” → “could you …”' },
      { re: /\bi am agree\b/i, fix: '“I am agree” → “I agree”' },
      { re: /\binformations\b/i, fix: '“informations” → “information”' },
      { re: /\badvices\b/i, fix: '“advices” → “advice”' },
      { re: /\bequipments\b/i, fix: '“equipments” → “equipment”' },
      { re: /\blooking forward to (hear|meet|see|receive|work)\b/i, fix: '“looking forward to hear” → “looking forward to hearing”' },
      { re: /\bexplain me\b/i, fix: '“explain me” → “explain to me”' },
      { re: /\b(more|most) (cheaper|better|bigger|faster|lower|higher)\b/i, fix: 'double comparative (“more cheaper”) → “cheaper”' },
      { re: /\brevert back\b/i, fix: '“revert back” → “reply” / “get back to you”' },
      { re: /\breturn back\b/i, fix: '“return back” → “return”' },
      { re: /\bcontact with\b/i, fix: '“contact with someone” → “contact someone”' },
      { re: /\bsend me until\b/i, fix: '“until” → “by” for deadlines' },
      { re: /\bdepend of\b/i, fix: '“depend of” → “depend on”' },
      { re: /\bmake a (decision|meeting) about\b/i, fix: 'check collocation (“make a decision on”, “have a meeting about”)' },
      { re: /\b(a|an) (\d[\d,]*) (units|pieces|pcs)\b/i, fix: 'no article before a plural number (“a 500 units” → “500 units”)' },
      { re: /\bplease kindly\b/i, fix: '“please kindly” is redundant → use one' },
      { re: /\bhow about (to)\b/i, fix: '“how about to …” → “how about …ing”' }
    ],

    capsWhitelist: ['KRW', 'USD', 'MOQ', 'RFQ', 'PM', 'CEO', 'CFO', 'COO', 'FOB', 'CIF', 'EXW', 'DDP', 'SKU', 'KPI', 'ROI', 'ASAP', 'FYI', 'EOD', 'COB', 'PO', 'HR', 'IT', 'UI', 'UX', 'Q1', 'Q2', 'Q3', 'Q4', 'OK', 'B2C', 'B2B', 'PDF', 'ML', 'SNS', 'CTR', 'CPC'],

    /** 역할별로 이메일에 담기길 기대하는 정보 신호 */
    roleSignals: {
      pm: [/\bdecid\w*|decision\b/i, /\bowner|responsible|assign\w*/i, /\bdeadline|by \w+day|priority\b/i, /\bgoal|target\b/i],
      coordinator: [/\bstatus|update|progress\b/i, /\bdeadline|due|by \w+day\b/i, /\bagenda|meeting|minutes|summary\b/i, /\bowner|responsible\b/i],
      design: [/\bdesign|concept|mock-?ups?|visual|finish|color|colour|matte|coating\b/i, /\bcustomer|user|review\b/i],
      sales: [/\bcustomers?|buyers?|segment\b/i, /\bchannels?|smart ?store|mall|online\b/i, /\bdemand|sales|units sold|target\b/i],
      finance: [/(krw|₩|won|\$|usd)/i, /\bcost|margin|budget|profit|revenue\b/i, /\d+(\.\d+)? ?%/],
      strategy: [/\bsegment|position\w*|differentiat\w*\b/i, /\boption|alternative|recommend\w*\b/i, /\btarget|goal|success\b/i],
      operations: [/\blead[- ]?time|delivery|shipping|schedule\b/i, /\binventory|stock|warehouse\b/i, /\brisk|delay|quality\b/i],
      procurement: [/\bquot(e|ation)|unit price|pric(e|ing)\b/i, /\bmoq|minimum order|quantity|units\b/i, /\bsupplier|vendor|lead[- ]?time|order\b/i]
    },

    messages: {
      emptyBody: 'Write the email body before assessing.',
      emptySubject: 'Add a subject line that names the topic (e.g. “Quotation request – 500 ml tumbler, 500 units”).',
      vagueSubject: 'Make the subject more specific — name the topic and, if useful, the action or deadline.',
      noGreeting: 'Start with a greeting and the person’s name (e.g. “Dear Ms. Park,”).',
      noNameExternal: 'For external partners, address the person by name or title.',
      noPurpose: 'State the purpose in the first one or two sentences (e.g. “I am writing to request …”).',
      latePurpose: 'Move your purpose closer to the start of the email.',
      noEvidence: 'Add a reason or data to support your message (because…, based on…, our survey shows…).',
      noRequest: 'Ask for a specific action — what exactly should the reader do?',
      genericRequest: 'Your request is general. Name exactly what you need (e.g. unit price, lead time, MOQ).',
      noDeadline: 'Add a deadline (e.g. “by Friday, Nov 14”).',
      vagueDeadline: 'Replace “ASAP/soon” with a specific date or time.',
      noNextStep: 'Say what happens next (e.g. “Once we receive your quote, we will …”).',
      noOwner: 'Make it clear who should act — address the request to the reader or name the owner.',
      noClosing: 'Add a closing line (e.g. “Thank you for your help.” / “Best regards,”).',
      noSignature: 'Sign with your name.',
      signatureExternal: 'For external emails, add your role and company under your name.',
      impolite: 'Soften direct commands — use “Could you …?” or “Would you please …?”.',
      tooShort: 'The email is very short. Add context, the specific request and a deadline.',
      tooLong: 'The email is long. Cut repetition and keep only what the reader needs.',
      repeated: 'Some sentences are repeated. Remove the repetition.',
      paragraphs: 'Split the message into short paragraphs (purpose → details → request → closing).',
      longParagraph: 'One paragraph is very long. Break it up.',
      fragments: 'Several lines are fragments or keyword lists. Write full sentences.',
      punctuation: 'End each sentence with a period or question mark; avoid “!!” or “??”.',
      capitalization: 'Start sentences with a capital letter and write “I” in capitals.',
      shouting: 'Avoid writing whole words in CAPITALS.',
      longSentences: 'Some sentences are very long. Aim for 10–25 words per sentence.',
      shortSentences: 'Sentences are very short and choppy. Combine related ideas.',
      wrongRecipient: 'This mission expects a different recipient: ',
      noRecipient: 'Add a recipient.',
      roleInfo: 'Include information your role is responsible for: ',
      bypassCoordinator: 'Approval requests should go through the Executive Coordinator (official channel), who reports to the PM.',
      externalApproval: 'Do not ask an external partner for internal approval. Send approval requests to the Coordinator/PM.',
      commitmentWithoutApproval: 'This email appears to commit to an order/terms without PM approval. Add “subject to PM approval” or get approval first.',
      decisionNotPM: 'Only the PM makes final decisions. Check that this decision was approved before announcing it.',
      korean: 'Korean text was found. Write the whole email in English — Korean parts were not assessed.',
      html: 'HTML/script-like text was found. It was treated as plain text and ignored in the analysis.'
    },
    strengths: {
      purpose: 'Clear purpose at the start.', evidence: 'Good use of reasons/data.', politeRequests: 'Polite, professional requests.',
      deadline: 'Clear deadline.', facts: 'All required mission facts included.', structure: 'Well-structured email.', signature: 'Complete signature.'
    }
  };

  /* ── Text helpers ───────────────────────────────────── */
  const VERBS = /\b(am|is|are|was|were|be|been|being|have|has|had|do|does|did|can|could|will|would|shall|should|may|might|must|need|needs|want|wants|like|send|sent|share|shared|confirm|confirmed|provide|provided|let|know|think|believe|suggest|recommend|propose|request|requested|ask|asked|order|ordered|plan|planning|hope|look|looking|appreciate|attach|attached|decide|decided|discuss|update|updated|receive|received|offer|offered|agree|agreed|prefer|include|includes|cost|costs|sold|reached|show|shows|expect|expected|deliver|delivered|produce|check|review|reviewed|prepare|prepared|finish|finished|complete|completed|meet|go|going|get|got|make|made|take|took|give|gave|seems|seem|note|find|found|write|writing|reach|reaching|follow|following|explain|compare|compared|choose|chose|chosen|select|selected|approve|approved|proceed|work|working|help|thank|thanks|apologize|inform|consider|increase|increases|decrease|fell|rose|rise|drop|dropped|remain|remains|start|started|happen|happened|lead|led|keep|kept|use|used|buy|bought|pay|paid|move|moved|call|try|tried|feel|felt|said|say|says|see|saw|seen|tell|told|understand|mean|means|wonder|wondering|wonder|requires|require|required|exceeds|exceed|fit|fits|affect|affects|believe|estimate|estimated|calculated|calculate)\b|\b\w{3,}ed\b/i;
  const STOP = new Set('the a an and or but if of to in on at for with from by as is are was were be been this that these those it its our your their we you they i me my us he she him her them will would could should can may might must have has had do does did not no so than then there here about into over under after before very more most also just only such each per via please dear hi hello best regards thank thanks team week'.split(' '));

  function stripNoise(text) {
    let flagsHtml = false, flagsKo = false;
    let t = String(text || '');
    if (RUBRIC.patterns.html.test(t)) { flagsHtml = true; t = t.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<\/?[a-z][a-z0-9]*(\s[^>]*)?>/gi, ' '); }
    const hangulChars = (t.match(/[ㄱ-ㆎ가-힣]/g) || []).length;
    const letters = (t.match(/[A-Za-zㄱ-ㆎ가-힣]/g) || []).length || 1;
    if (hangulChars) { flagsKo = true; t = t.replace(/[ㄱ-ㆎ가-힣]+/g, ' '); }
    t = t.replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/\r\n?/g, '\n');
    return { text: t, html: flagsHtml, korean: flagsKo, koreanRatio: hangulChars / letters };
  }
  const words = s => (String(s).match(/[A-Za-z0-9₩$%][A-Za-z0-9'’,.\-₩$%]*/g) || []).filter(w => /[A-Za-z0-9]/.test(w));
  function splitParagraphs(t) { return t.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean); }
  function splitLines(t) { return t.split('\n').map(l => l.trim()).filter(Boolean); }
  function splitSentences(t) {
    const out = [];
    for (const line of splitLines(t)) {
      const parts = line.replace(/([.!?])\s+(?=[A-Z0-9"'(₩])/g, '$1\u0001').split('\u0001');
      for (const p of parts) if (p.trim()) out.push(p.trim());
    }
    return out;
  }
  const isGreetingLine = l => RUBRIC.patterns.greeting.test(l) && words(l).length <= 6;
  const isClosingLine = l => /^(best regards|kind regards|warm regards|regards|sincerely|best wishes|best|thanks|thank you|many thanks|cheers|all the best)[,.!]?$/i.test(l.trim());
  const hasVerb = s => VERBS.test(s);
  const isSubstantive = s => words(s).length >= 4 && !isGreetingLine(s) && !isClosingLine(s);
  const isFullSentence = s => words(s).length >= 5 && hasVerb(s);

  /* Numbers & units */
  function toNum(s) { if (!s) return null; let x = String(s).toLowerCase().replace(/,/g, '').trim(); let mult = 1; if (/k$/.test(x)) { mult = 1000; x = x.slice(0, -1); } const n = parseFloat(x); return isNaN(n) ? null : n * mult; }
  const NUM = '(\\d{1,3}(?:,\\d{3})+|\\d+(?:\\.\\d+)?)(\\s?k)?';
  const UNIT_WORDS = 'units?|pcs|pieces?|pc|ea|tumblers?|bottles?|items?|sets?|cups?';
  function extractQuantities(sentence) {
    const out = []; const s = sentence;
    const push = (category, value, raw, index) => { if (value != null) out.push({ category, value, raw: raw.trim(), index }); };
    let m;
    const reCur = new RegExp(`(?:krw|₩|won)\\s?${NUM}|${NUM}\\s?(?:krw|won|원)`, 'gi');
    while ((m = reCur.exec(s))) push('currency', toNum((m[1] || m[3]) + (m[2] || m[4] || '')), m[0], m.index);
    const rePct = new RegExp(`${NUM}\\s?(?:%|percent|per cent)`, 'gi');
    while ((m = rePct.exec(s))) push('percent', toNum(m[1]), m[0], m.index);
    const reMl = /(\d+(?:\.\d+)?)\s?(ml|millilit(?:er|re)s?|l|lit(?:er|re)s?)\b/gi;
    while ((m = reMl.exec(s))) { const v = parseFloat(m[1]) * (/^m/i.test(m[2]) ? 1 : 1000); push('volume', v, m[0], m.index); }
    const reUnits = new RegExp(`${NUM}[\\s-]?(?:${UNIT_WORDS})\\b`, 'gi');
    while ((m = reUnits.exec(s))) push('quantity', toNum(m[1] + (m[2] || '')), m[0], m.index);
    const reQty = new RegExp(`\\b(?:quantity of|qty\\.?|order of|orders? for|moq of|volume of|batch of)\\s?${NUM}`, 'gi');
    while ((m = reQty.exec(s))) push('quantity', toNum(m[1] + (m[2] || '')), m[0], m.index);
    // de-duplicate overlapping quantity hits
    return out.filter((x, i) => out.findIndex(y => y.category === x.category && y.value === x.value && Math.abs(y.index - x.index) < 12) === i);
  }
  function negatedAt(sentence, index) {
    const before = sentence.slice(Math.max(0, index - 30), index);
    return /\b(not|no|never|without|cannot|can't|won't|don't|doesn't|didn't|isn't|aren't)\b[^.?!]*$/i.test(before) && !/\b(not only)\b/i.test(before);
  }
  const hasNumber = t => /\d/.test(t);

  /* ── Scoring helpers ───────────────────────────────── */
  function addItem(ctx, cat, item, earned, note) {
    const max = RUBRIC.categories[cat].items[item];
    ctx.items.push({ category: cat, item, label: RUBRIC.itemLabels[item], max, earned: earned == null ? null : Math.max(0, Math.min(max, Math.round(earned * 10) / 10)), note: note || '' });
  }
  const improve = (ctx, msg) => { if (msg && !ctx.improvements.includes(msg)) ctx.improvements.push(msg); };
  const flag = (ctx, msg) => { if (msg && !ctx.manualReviewFlags.includes(msg)) ctx.manualReviewFlags.push(msg); };

  function gradeOf(score) { for (const [min, g] of RUBRIC.grades) if (score >= min) return g; return 'Revision Required'; }

  function matchExpectedRecipient(expected, c) {
    if (!expected) return null;
    const opts = String(expected).split('|').map(s => s.trim().toLowerCase()).filter(Boolean);
    const rec = String(c.recipient || '').toLowerCase();
    return opts.some(o => {
      if (o === 'director') return c.recipientRole === 'director';
      if (o.startsWith('role:')) return c.recipientRole === o.slice(5);
      if (o.startsWith('type:')) return String(c.recipientType || '').toLowerCase() === o.slice(5);
      if (o.startsWith('email:')) return rec === o.slice(6);
      return rec === o || c.recipientRole === o;
    });
  }
  function describeExpected(expected) {
    return String(expected).split('|').map(o => o.trim()).map(o => o.startsWith('role:') ? o.slice(5) + ' (role)' : o.startsWith('type:') ? 'a ' + o.slice(5) + ' contact' : o.startsWith('email:') ? o.slice(6) : o).join(' or ');
  }

  function detectType(text) {
    let best = null, bestScore = 0;
    for (const [key, cfg] of Object.entries(RUBRIC.emailTypes)) {
      const sc = cfg.detect.reduce((s, re) => s + (re.test(text) ? 1 : 0), 0);
      if (sc > bestScore) { best = key; bestScore = sc; }
    }
    return bestScore >= 1 ? best : null;
  }

  /* ── Main ───────────────────────────────────────────── */
  function assessEmail(input) {
    const { subject = '', body = '', recipient = '', senderRole = '', missionConfig = null, context = {} } = input || {};
    const ctx = { items: [], strengths: [], improvements: [], detectedFacts: [], missingRequirements: [], metRequirements: [], manualReviewFlags: [] };
    const base = { assessmentType: 'RULE_BASED', rubricVersion: RUBRIC.version, label: RUBRIC.label };

    const subj = stripNoise(subject).text.trim();
    const cleaned = stripNoise(body);
    const text = cleaned.text.trim();
    if (cleaned.html || RUBRIC.patterns.html.test(subject)) flag(ctx, RUBRIC.messages.html);
    if (cleaned.korean) { flag(ctx, RUBRIC.messages.korean); improve(ctx, RUBRIC.messages.korean); }

    if (!text) {
      const categories = Object.fromEntries(Object.keys(RUBRIC.categories).map(k => [k, 0]));
      return { ...base, score: 0, grade: gradeOf(0), categories, categoryMax: catMax(), items: [], emailType: null, emailTypeSource: 'none', strengths: [], improvements: [RUBRIC.messages.emptyBody, ...(subj ? [] : [RUBRIC.messages.emptySubject])], detectedFacts: [], metRequirements: [], missingRequirements: ['Email body'], manualReviewFlags: ctx.manualReviewFlags, confidence: 'limited', wordCount: 0 };
    }

    const lines = splitLines(text);
    const paragraphs = splitParagraphs(text);
    const sentences = splitSentences(text);
    const subst = sentences.filter(isSubstantive);
    const full = sentences.filter(isFullSentence);
    const wc = words(text).length;
    const internal = context.internal != null ? !!context.internal : /@worqend\.com$/i.test(recipient);
    const explicitType = context.emailType && context.emailType !== 'AUTO' ? context.emailType : null;
    const emailType = (missionConfig && missionConfig.email_type) || explicitType || detectType(text);
    const typeCfg = emailType ? RUBRIC.emailTypes[emailType] : null;
    const emailTypeSource = missionConfig && missionConfig.email_type ? 'mission' : explicitType ? 'selected' : emailType ? 'detected' : 'none';
    const requestSentences = sentences.filter(s => (RUBRIC.patterns.requestMarker.test(s) || /\?\s*$/.test(s)) && words(s).length >= 3);
    const fragmentRatio = subst.length ? 1 - full.length / Math.max(1, subst.length) : 1;
    const keywordList = lines.length >= 4 && lines.filter(l => words(l).length <= 3 && !isGreetingLine(l) && !isClosingLine(l)).length / lines.length > 0.5;
    if (keywordList) flag(ctx, 'Looks like a keyword list rather than sentences — check manually.');

    /* ── Task Completion ── */
    const evidenceHit = full.some(s => RUBRIC.patterns.evidence.test(s));
    const numberHit = full.some(hasNumber);
    if (missionConfig) {
      const facts = missionConfig.required_facts || [], acts = missionConfig.required_actions || [];
      const totalW = facts.reduce((s, f) => s + (Number(f.weight) || 1), 0) + acts.reduce((s, a) => s + (Number(a.weight) || 1), 0);
      let got = 0;
      for (const f of facts) {
        const w = Number(f.weight) || 1, r = checkFact(f, sentences, full, ctx);
        if (r.met) { got += w; ctx.metRequirements.push(r.label); } else ctx.missingRequirements.push(r.missing);
      }
      for (const a of acts) {
        const w = Number(a.weight) || 1, r = checkAction(a, sentences, full);
        if (r.met) { got += w; ctx.metRequirements.push(r.label); } else ctx.missingRequirements.push(r.missing);
      }
      addItem(ctx, 'taskCompletion', 'facts', totalW ? got / totalW * 10 : null, totalW ? `${Math.round(got / totalW * 100)}% of weighted mission requirements` : 'No requirements configured');
      if (totalW && got === totalW) ctx.strengths.push(RUBRIC.strengths.facts);
    } else if (typeCfg) {
      const r = typeRequirements(typeCfg, sentences, full, requestSentences, evidenceHit, numberHit);
      r.met.forEach(m => ctx.metRequirements.push(m)); r.missing.forEach(m => ctx.missingRequirements.push(m));
      addItem(ctx, 'taskCompletion', 'facts', r.ratio * 10, `${typeCfg.label}: ${r.met.length}/${r.met.length + r.missing.length} type requirements (no mission configured)`);
    } else addItem(ctx, 'taskCompletion', 'facts', null, 'N/A — no mission and email type could not be determined');
    if (missionConfig && typeCfg) {
      const r = typeRequirements(typeCfg, sentences, full, requestSentences, evidenceHit, numberHit);
      r.missing.forEach(m => improve(ctx, `${typeCfg.label}: add ${m.charAt(0).toLowerCase() + m.slice(1)}.`));
    }
    // purpose
    const bodyStart = sentences.filter(s => !isGreetingLine(s)).slice(0, 3);
    if (bodyStart.some(s => RUBRIC.patterns.purpose.test(s) && words(s).length >= 4)) { addItem(ctx, 'taskCompletion', 'purpose', 5); ctx.strengths.push(RUBRIC.strengths.purpose); }
    else if (sentences.some(s => RUBRIC.patterns.purpose.test(s) && words(s).length >= 4)) { addItem(ctx, 'taskCompletion', 'purpose', 3, 'Purpose appears late'); improve(ctx, RUBRIC.messages.latePurpose); }
    else if (bodyStart.some(isFullSentence) && typeCfg && typeCfg.detect.some(re => bodyStart.some(s => re.test(s)))) addItem(ctx, 'taskCompletion', 'purpose', 3, 'Purpose implied by the first sentences');
    else { addItem(ctx, 'taskCompletion', 'purpose', 0); improve(ctx, RUBRIC.messages.noPurpose); }
    // evidence
    const evScore = evidenceHit && numberHit ? 5 : evidenceHit ? 3.5 : numberHit ? 2 : 0;
    addItem(ctx, 'taskCompletion', 'evidence', evScore);
    if (evScore >= 5) ctx.strengths.push(RUBRIC.strengths.evidence); else if (evScore < 3) improve(ctx, RUBRIC.messages.noEvidence);
    // relevance
    if (missionConfig) {
      const kw = missionKeywords(missionConfig);
      const hit = kw.filter(k => new RegExp(`\\b${k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i').test(full.join(' '))).length;
      addItem(ctx, 'taskCompletion', 'relevance', hit >= 3 ? 5 : hit === 2 ? 3.5 : hit === 1 ? 2 : 0, `${hit} mission keyword(s) used in full sentences`);
      if (hit === 0) improve(ctx, 'Connect the email to your mission — mention the product, numbers and topic of this week’s task.');
    } else addItem(ctx, 'taskCompletion', 'relevance', null, 'N/A — no mission configured');

    /* ── Clarity & Structure ── */
    const sw = words(subj).length;
    if (!subj) { addItem(ctx, 'clarity', 'subject', 0, 'Empty subject'); improve(ctx, RUBRIC.messages.emptySubject); }
    else if (sw < 2 || /^(hi|hello|question|request|email|update|re:?|fw:?|urgent|important)$/i.test(subj.replace(/[!.?]/g, '').trim())) { addItem(ctx, 'clarity', 'subject', 1.5, 'Too vague'); improve(ctx, RUBRIC.messages.vagueSubject); }
    else if (sw > 14) { addItem(ctx, 'clarity', 'subject', 2.5, 'Too long'); improve(ctx, RUBRIC.messages.vagueSubject); }
    else addItem(ctx, 'clarity', 'subject', sw >= 3 ? 4 : 3);
    const hasGreeting = lines.length && RUBRIC.patterns.greeting.test(lines[0]);
    const openingOk = hasGreeting && bodyStart.some(isFullSentence);
    addItem(ctx, 'clarity', 'opening', openingOk ? 4 : hasGreeting || bodyStart.some(isFullSentence) ? 2 : 0);
    const bodyParas = paragraphs.filter(p => words(p).length > 3);
    let paraScore;
    if (wc < 60) paraScore = paragraphs.length >= 2 ? 4 : 3;
    else paraScore = bodyParas.length >= 3 ? 4 : bodyParas.length === 2 ? 3 : 1;

    },
    customer: {
      priceHigh: ['Honestly, KRW {price} feels a bit expensive to me. I would usually pay up to about KRW {priceLimit} for a tumbler.', 'KRW {price}? Hmm, that is more than I normally spend — around KRW {priceLimit} feels right to me.'],
      priceOk: ['KRW {price} sounds reasonable to me, especially if it keeps drinks cold all day.', 'At KRW {price}, I would definitely consider it.'],

      clarify: 'Sorry, I’m not sure what you’re asking. Do you want my opinion on the design, the size, or the price?'
