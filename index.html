  };

  /* ── Entity extraction ─────────────────────────────── */
  const NUM = '(\\d{1,3}(?:,\\d{3})+|\\d+(?:\\.\\d+)?)(\\s?k\\b)?';
  const toNum = (a, k) => { const n = parseFloat(String(a).replace(/,/g, '')); return isNaN(n) ? null : n * (k ? 1000 : 1); };
  const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  const DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const MONTH_RE = '(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?';

  function parseDateText(txt, base) {
    let m;
    if ((m = txt.match(new RegExp(`(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?${MONTH_RE}`, 'i')))) return mk(MONTHS[m[2].slice(0, 3).toLowerCase()], +m[1]);
    if ((m = txt.match(new RegExp(`${MONTH_RE}\\s+(\\d{1,2})(?:st|nd|rd|th)?`, 'i')))) return mk(MONTHS[m[1].slice(0, 3).toLowerCase()], +m[2]);
    if ((m = txt.match(/\b(\d{1,2})[\/.](\d{1,2})\b/))) return mk(+m[1] - 1, +m[2]);
    return null;
    function mk(mo, day) { const d = new Date(base.getFullYear(), mo, day); if (d < new Date(base.getFullYear(), base.getMonth(), base.getDate())) d.setFullYear(d.getFullYear() + 1); return isNaN(d) ? null : d.getTime(); }
  }

  function extractEntities(message, now) {
    const t = String(message || '').replace(/[‘’]/g, "'");
    const base = now ? new Date(now) : new Date();
    const e = { quantities: [], prices: [], percents: [], dates: [], variant: null, finish: null, budget: null, product: null, suppliers: [], orders: null, ordersPer: null, launchDate: null, objective: null, target: null, stock: null };
    let m;
    // orders (logistics volume) — "30 orders per day", "30 tumbler orders", "orders of 30 a day"
    const reOrders = /(\d[\d,]*)\s*(?:tumbler\s+|customer\s+|online\s+)?orders?\b(?:\s*(?:per|a|each|every)\s*(day|week|month))?|(\d[\d,]*)\s*(?:orders?)?\s*(?:per|a)\s*(day|week|month)\b/i;
    if ((m = t.match(reOrders))) { e.orders = toNum(m[1] || m[3]); e.ordersPer = (m[2] || m[4] || '').toLowerCase() || null; if (/\bdaily\b/i.test(t) && !e.ordersPer) e.ordersPer = 'day'; if (/\bmonthly\b/i.test(t) && !e.ordersPer) e.ordersPer = 'month'; }
    const reQ = new RegExp(`${NUM}[\\s-]?(?:units?|pcs|pieces?|pc|ea|tumblers?|bottles?|sets?)\\b(?!\\s*orders?)|\\b(?:quantity of|qty\\.?|order of|orders? for|batch of|stock of)\\s?${NUM}`, 'gi');
    while ((m = reQ.exec(t))) { const v = m[1] ? toNum(m[1], m[2]) : toNum(m[3], m[4]); if (v != null && !negated(t, m.index)) e.quantities.push(v); }
    const reP = new RegExp(`(?:krw|₩)\\s?${NUM}(\\s?(?:million|m)\\b)?|${NUM}(\\s?(?:million|m)\\b)?\\s?(?:krw|won|원)`, 'gi');
    while ((m = reP.exec(t))) { let v = m[1] ? toNum(m[1], m[2]) : toNum(m[4], m[5]); if ((m[3] || m[6])) v *= 1000000; if (v != null) e.prices.push({ value: v, index: m.index }); }
    const rePct = new RegExp(`${NUM}\\s?(?:%|percent|per cent)`, 'gi');
    while ((m = rePct.exec(t))) e.percents.push(toNum(m[1]));
    const budgetM = t.match(new RegExp(`budget[^.?!\\d₩]{0,30}(?:krw|₩)?\\s?${NUM}(\\s?(?:million|m)\\b)?`, 'i')) || t.match(new RegExp(`(?:krw|₩)\\s?${NUM}(\\s?(?:million|m)\\b)?[^.?!]{0,30}budget`, 'i'));
    if (budgetM) { let v = toNum(budgetM[1], budgetM[2]); if (budgetM[3]) v *= 1000000; e.budget = v; }
    if (/\b900\s?ml\b|\boutdoor\b/i.test(t)) e.variant = '900 ml'; else if (/\b500\s?ml\b|\blightweight\b|\bcommuter\b/i.test(t)) e.variant = '500 ml';
    if (/\bpremium( coating| finish)?\b|\bcoating\b/i.test(t)) e.finish = 'premium coating'; else if (/\bmatte\b|\bstandard finish\b/i.test(t)) e.finish = 'matte';
    if (/\btumblers?\b/i.test(t)) e.product = 'tumbler';
    if (/\b(brand )?awareness\b|\bbrand reach\b/i.test(t)) e.objective = 'awareness'; else if (/\b(direct )?sales\b|\bconversions?\b|\bpurchases\b/i.test(t) && /\b(goal|objective|focus|aim|drive|increase)\b/i.test(t)) e.objective = 'direct sales';
    const tg = t.match(/\b(office workers|commuters|campers|students|parents|young professionals|people in their (?:20s|30s)|(?:20s|30s) (?:women|men)|hikers)\b/i); if (tg) e.target = tg[1].toLowerCase();
    const st = t.match(/\bstock (?:of )?(\d[\d,]*)\b|\b(\d[\d,]*) (?:units )?in stock\b/i); if (st) e.stock = toNum(st[1] || st[2]);
    const lm = t.match(new RegExp(`launch(?:ing)?(?:\\s+date)?(?:\\s+(?:is|will be|would be|on|planned for|scheduled for|of))*\\s*[^.?!\\d]{0,12}((?:\\d{1,2}(?:st|nd|rd|th)?\\s+(?:of\\s+)?${MONTH_RE})|(?:${MONTH_RE}\\s+\\d{1,2})|(?:\\d{1,2}[\\/.]\\d{1,2}))`, 'i'));
    if (lm) e.launchDate = parseDateText(lm[1], base);
    const reDate = new RegExp(`\\b(?:by|before|on|until|no later than)\\s+((?:\\d{1,2}(?:st|nd|rd|th)?\\s+${MONTH_RE})|(?:${MONTH_RE}\\s+\\d{1,2}(?:st|nd|rd|th)?)|(?:\\d{1,2}[\\/.]\\d{1,2})|(?:next\\s+)?(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday))`, 'gi');
    while ((m = reDate.exec(t))) {
      let d = parseDateText(m[1], base);
      const dn = m[1].match(/(sunday|monday|tuesday|wednesday|thursday|friday|saturday)/i);
      if (!d && dn) { const target = DAYS.indexOf(dn[1].toLowerCase()); const x = new Date(base); let add = (target - x.getDay() + 7) % 7 || 7; if (/next/i.test(m[1]) && add < 7) add += 7; x.setDate(x.getDate() + add); d = x.getTime(); }
      if (d && d !== e.launchDate) e.dates.push({ date: d, text: m[0].trim() });
    }
    if ((m = t.match(/\bwithin (\d+) weeks?\b|\bin (\d+) weeks?\b/i))) { const d = new Date(base); d.setDate(d.getDate() + 7 * +(m[1] || m[2])); e.dates.push({ date: d.getTime(), text: m[0] }); }
    if (/\bsupplier a\b|\bdaon\b/i.test(t)) e.suppliers.push('A');
    if (/\bsupplier b\b|\bquickform\b/i.test(t)) e.suppliers.push('B');
    e.quantity = e.quantities.length ? Math.max(...e.quantities) : null;
    e.price = e.prices.length ? e.prices[0].value : null;
    if (e.budget != null) e.prices = e.prices.filter(p => p.value !== e.budget), e.price = e.prices.length ? e.prices[0].value : null;
    e.percent = e.percents.length ? e.percents[0] : null;
    e.date = e.dates.length ? e.dates[0] : null;
    e.approvalRef = /\b(approved (by|po|purchase order)|(pm|ceo|manager) (has )?approved|po (number|no\.?|#)\s*\w+|attached (is )?(the |our )?(approved )?(po|purchase order)|internal approval (is )?(done|completed|received))\b/i.test(t);
    return e;
  }
  function negated(t, i) { return /\b(not|no|never|don't|do not|won't)\b[^.?!,;]{0,25}$/i.test(t.slice(Math.max(0, i - 30), i)); }

  /* ── Intent detection ─────────────────────────────── */
  function detectIntent(message, context) {
    const t = String(message || '');
    const kind = context && context.npcKind;
    let found = Object.entries(INTENTS).filter(([, c]) => c.re.test(t)).map(([id]) => id);
    const allowed = KIND_INTENTS[kind];
    if (allowed) found = found.filter(i => allowed.includes(i));
    if (found.length > 1) found = found.filter(i => i !== 'thanks');
    if (kind === 'channel') found = found.map(i => i === 'quotation' ? 'listing' : i);
    if (kind === 'agency') found = found.map(i => i === 'quotation' ? 'budget' : i);
    if (kind === 'customer' && found.includes('quotation')) found = ['opinion', ...found.filter(i => i !== 'quotation' && i !== 'opinion')];
    if (found.includes('order') && found.includes('quotation') && /\b(confirm|place|proceed|go ahead|book)\b/i.test(t)) found = found.filter(i => i !== 'quotation');
    // 할인 요청이면 견적 의도는 할인 응답에 포함
    if (found.includes('discount') && (kind === 'logistics' || kind === 'channel' || kind === 'agency')) found = found.filter(i => i !== 'quotation' || kind === 'logistics');
    return found.length ? [...new Set(found)] : ['unknown'];
  }

  /* ── Template rendering ───────────────────────────── */
  function pick(tpl, turn) { return Array.isArray(tpl) ? tpl[(turn || 0) % tpl.length] : tpl; }
  function generateReply(template, variables, turn) {
    const tpl = pick(template, turn);
    if (!tpl) return '';
    return String(tpl).split('\n').map(line => {
      let missing = false;
      const out = line.replace(/\{(\w+)\}/g, (_, k) => {
        const v = variables[k];
        if (v === undefined || v === null) { missing = true; return ''; }
        return typeof v === 'number' ? v.toLocaleString('en-US', { maximumFractionDigits: 2 }) : String(v);
      });
      return missing ? null : out;
    }).filter(l => l !== null).join('\n').trim();
  }

  const fmtDate = ts => new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const addDays = (ts, d) => { const x = new Date(ts); x.setDate(x.getDate() + d); return x.getTime(); };
  const addWeeks = (ts, w) => addDays(ts, w * 7);
  const listText = arr => arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];
  const perText = p => p === 'day' ? 'per day' : p === 'week' ? 'per week' : p === 'month' ? 'per month' : '';
  const monthlyFrom = (n, per) => per === 'day' ? n * 30 : per === 'week' ? Math.round(n * 4.3) : per === 'month' ? n : null;

  /** 이번 메시지로 새로 알게 된 정보 → 기억(facts)에 합치기 */
  function mergeFacts(prev, e) {
    const f = { ...(prev || {}) };
    const set = (k, v) => { if (v !== null && v !== undefined && v !== '') f[k] = v; };
    set('qty', e.quantity); set('variant', e.variant); set('finish', e.finish); set('budget', e.budget); set('price', e.price);
    set('objective', e.objective); set('target', e.target); set('launchDate', e.launchDate); set('stock', e.stock);
    if (e.orders != null) { f.orders = e.orders; f.ordersPer = e.ordersPer || null; }
    else if (e.ordersPer && f.orders != null && !f.ordersPer) f.ordersPer = e.ordersPer;
    if (!e.orders && !e.ordersPer && f.orders != null && !f.ordersPer) { const pm = /\bper (day|week|month)\b|\b(daily|weekly|monthly)\b/i.exec(e._raw || ''); if (pm) f.ordersPer = (pm[1] || { daily: 'day', weekly: 'week', monthly: 'month' }[pm[2].toLowerCase()]).toLowerCase(); }
    return f;
  }
  function newFactsText(prev, f, kind) {
    const p = prev || {}, out = [];
    const rel = { supplier: ['qty', 'launchDate'], logistics: ['orders', 'qty', 'launchDate'], agency: ['budget', 'objective', 'target', 'launchDate'], channel: ['price', 'stock', 'qty', 'launchDate'] }[kind];
    const ok = k => !rel || rel.includes(k);
    if (ok('orders') && f.orders != null && f.orders !== p.orders) out.push(`about ${f.orders.toLocaleString('en-US')} orders${f.ordersPer ? ' ' + perText(f.ordersPer) : ''}`);
    if (ok('qty') && f.qty != null && f.qty !== p.qty) out.push(`${f.qty.toLocaleString('en-US')} units`);
    if (ok('launchDate') && f.launchDate && f.launchDate !== p.launchDate) out.push(`a launch date of ${fmtDate(f.launchDate)}`);
    if (ok('budget') && f.budget != null && f.budget !== p.budget) out.push(`a budget of KRW ${f.budget.toLocaleString('en-US')}`);
    if (ok('objective') && f.objective && f.objective !== p.objective) out.push(`${f.objective} as the goal`);
    if (ok('target') && f.target && f.target !== p.target) out.push(`${f.target} as the target`);
    if (ok('price') && f.price != null && f.price !== p.price) out.push(`a selling price of KRW ${f.price.toLocaleString('en-US')}`);
    if (ok('stock') && f.stock != null && f.stock !== p.stock) out.push(`stock of ${f.stock.toLocaleString('en-US')} units`);
    return listText(out);
  }

  /* ── Scenario selection (kind-specific rules) ─────── */
  function selectScenarioResponse({ npc, intent, entities, projectState, state }) {
    const kind = npc.kind || 'supplier';
    const T = { ...(TEMPLATES[kind] || {}), ...(npc.templates || {}) };
    const C = TEMPLATES.common;
    const now = projectState.now || Date.now();
    const turn = (state && state.turns) || 0;
    const s = { ...state };
    const f = s.facts || {};
    const R = (tpl, vars) => generateReply(tpl, vars, turn);
    const blocks = []; let next = s.state || 'INITIAL_CONTACT'; let outcome = null;
    const advance = st => { const order = STATES.indexOf(st), cur = STATES.indexOf(next); if (order > cur || next === 'CLOSED') next = st; };

    if (kind === 'supplier') {
      const qty = entities.quantity || s.lastQuote?.qty || f.qty || null;
      const variant = entities.variant || s.lastQuote?.variant || f.variant || (npc.variants ? Object.keys(npc.variants)[0] : null);
      const finish = entities.finish || s.lastQuote?.finish || f.finish || null;
      const priceFor = () => { let unit = Number(npc.unitPrice || 0) + Number((npc.variants || {})[variant] || 0); if (finish && npc.finishes && npc.finishes[finish] != null) unit = Math.round(unit * (1 + Number(npc.finishes[finish]))); return unit; };
      const finishText = finish ? ` with ${finish}` : '';
      const moq = Number(npc.moq || 0);
      const discountOn = npc.discountThreshold && npc.discountRate && (projectState.week || 1) >= (npc.discountFromWeek || 1);
      if (intent === 'quotation' || intent === 'moq') {
        if (intent === 'moq' && !entities.quantity) { blocks.push(R(T.moqInfo, { moq })); advance('INFORMATION_REQUESTED'); }
        else if (!qty) {
          const missing = ['the order quantity', !variant && npc.variants ? 'the size (500 ml or 900 ml)' : null, !finish && npc.finishes ? 'the finish (matte or premium coating)' : null].filter(Boolean);
          blocks.push(R(T.askQuote, { missingList: listText(missing) }));
          if (intent === 'quotation') blocks.push(R(T.moqInfo, { moq }));
          advance('INFORMATION_REQUESTED');
        } else if (qty < moq) { blocks.push(R(T.moqShort, { moq, qty })); advance('INFORMATION_REQUESTED'); }
        else {
          const unit = priceFor(), total = unit * qty;
          const same = s.lastQuote && s.lastQuote.qty === qty && s.lastQuote.unit === unit && s.lastQuote.variant === variant && s.lastQuote.finish === finish;
          blocks.push(R(same ? T.quoteRepeat : T.quote, { qty, variant, finishText, unitPrice: unit, total, lastQuoteDate: same ? fmtDate(s.lastQuote.at) : null }));
          if (!finish && npc.finishes && !same) blocks.push(`This price is for the standard matte finish. Premium coating adds ${Math.round(Number(Object.values(npc.finishes)[0]) * 100)}% to the unit price.`);
          if (intent === 'moq') blocks.push(R(T.moqInfo, { moq }));
          s.lastQuote = { qty, unit, variant, finish, at: same ? s.lastQuote.at : now };
          if (!same) outcome = { type: 'quotation', qty, unitPrice: unit, total, variant, finish };
          advance('QUOTATION_PROVIDED');
        }
      } else if (intent === 'delivery') {
        const lw = Number(npc.leadTimeWeeks || 0);
        const wanted = entities.date || (f.launchDate ? { date: f.launchDate } : null);
        if (wanted) {
          const earliest = addWeeks(now, lw);
          blocks.push(wanted.date >= earliest ? R(T.leadDateOk, { wantedDate: fmtDate(wanted.date), orderBy: fmtDate(addWeeks(wanted.date, -lw)) }) : R(T.leadDateNo, { wantedDate: fmtDate(wanted.date), earliest: fmtDate(earliest), leadWeeks: lw }));

      } else if (intent === 'discount') {

        else if (!discountOn) blocks.push(R(T.discountNotYet, {}));
        else if (entities.percent && entities.percent > rate * 100 + 0.01) blocks.push(R(T.discountTooHigh, { requestedPct: entities.percent, discountPct: Math.round(rate * 100), threshold: th }));
        else if (qty && qty < th) blocks.push(R(T.discountBelow, { threshold: th, qty, unitPrice: priceFor() }));
        else {
          const q = Math.max(qty || 0, th), unit = Math.round(priceFor() * (1 - rate));
          blocks.push(R(T.discountOffer, { threshold: th, discountPct: Math.round(rate * 100), discountedUnit: unit, discountedTotal: unit * q, qtyForDiscount: q }));
          s.lastQuote = { qty: q, unit, variant, finish, at: now, discount: rate };

        }
        advance('NEGOTIATING');
      } else if (intent === 'order') {
        const q = entities.quantity || s.lastQuote?.qty || f.qty;
        if (!q) { blocks.push(R(T.orderNeedQty, {})); advance('INFORMATION_REQUESTED'); }
        else if (q < moq) { blocks.push(R(T.moqShort, { moq, qty: q })); advance('NEGOTIATING'); }
        else if (s.state === 'ORDER_CONFIRMED') blocks.push(`Your order of ${s.order.qty.toLocaleString('en-US')} units was already confirmed on ${fmtDate(s.order.at)}. We will update you on production progress.`);
        else if (!projectState.orderApproved) { blocks.push(R(T.orderNeedApproval, {})); advance('AWAITING_APPROVAL'); outcome = { type: 'order_pending_approval', qty: q }; }
        else {
          const unit = s.lastQuote && s.lastQuote.qty === q ? s.lastQuote.unit : (q >= (npc.discountThreshold || Infinity) && discountOn ? Math.round(priceFor() * (1 - npc.discountRate)) : priceFor());
          blocks.push(R(T.orderConfirmed, { qty: q, variant, finishText, unitPrice: unit, total: unit * q, leadWeeks: npc.leadTimeWeeks, paymentTerms: npc.paymentTerms || null }));
          s.order = { qty: q, unit, total: unit * q, at: now }; next = 'ORDER_CONFIRMED';

        }
      } else if (intent === 'sample') blocks.push(R(T.sample, { sampleDays: npc.sampleDays }));
      else if (intent === 'complaint') blocks.push(R(T.complaint, {}));

        if (need.length) { blocks.push(R(T.listingAsk, { missingList: listText([...need, 'the main product images']) })); advance('INFORMATION_REQUESTED'); }
        else { blocks.push(R(T.listingReady, { facts: newFactsText({}, f, 'channel'), reviewDays: npc.reviewDays || 3 })); advance('QUOTATION_PROVIDED'); }
      } else if (intent === 'discount') { blocks.push(R(T.discountPolicy, { promo: npc.promo || '' })); advance('NEGOTIATING'); }
      else if (intent === 'results') { const res = (npc.results || []).filter(r => (projectState.week || 1) >= r.fromWeek).pop(); blocks.push(res ? R(T.results, { resultsText: res.text }) : R(T.resultsNotYet, {})); }

        else if (!projectState.orderApproved) { blocks.push(R(T.orderNeedPO, {})); advance('AWAITING_APPROVAL'); }
        else { blocks.push(R(T.orderConfirmed, { launchDate: fmtDate(f.launchDate) })); next = 'ORDER_CONFIRMED'; }
      } else if (intent === 'thanks') blocks.push(R(C.thanks, {}));
      else blocks.push(R(T.clarify, {}));
    }

    else if (kind === 'customer') {
      const said = [];
      if (intent === 'opinion' || intent === 'quotation' || intent === 'discount') {
        const price = entities.price;
        if (price) said.push(R(price > Number(npc.priceLimit) ? T.priceHigh : T.priceOk, { price, priceLimit: Number(npc.priceLimit) }));

    else blocks.push('Thank you for your message. Could you clarify what you need?');

    return { blocks: blocks.filter(Boolean), state: { ...s, state: next }, outcome };
  }

  /** 전체 처리: 의도 → 정보 → 기억 → 규칙 → 답장 (같은 답장 반복 방지) */

    const text = `${message.subject || ''}\n${message.body || ''}`;
    const entities = extractEntities(text, projectState.now);

    const intents = detectIntent(message.body || message.subject || '', { npcKind: npc.kind });

      const r = selectScenarioResponse({ npc, intent, entities, projectState, state: st });
      st = { ...r.state, facts: st.facts, turns: st.turns }; blocks.push(...r.blocks); if (r.outcome) outcomes.push(r.outcome);

      const lead = generateReply(TEMPLATES.common.repeatLead, {}, st.turns);

  return { STATES, INTENTS, TEMPLATES, detectIntent, extractEntities, selectScenarioResponse, generateReply, respond };
})();

/* ═════════════════════════════════════════════════════════════
   WORQEND · Wallet Engine (가상 예산 · 실제 돈 아님)
   - 모든 금액 변동은 원장(ledger)에 추가만 됩니다. 수정·삭제 대신 정정 거래를 남깁니다.
   - 잔액은 원장에서 계산합니다: Allocated · Committed · Actual · Available
   - 브라우저(로컬 테스트)와 Code.gs(서버, 정식 운영)가 같은 규칙으로 검증합니다.
   ═════════════════════════════════════════════════════════════ */
const WalletEngine = (function () {
  'use strict';

  const TYPES = {
    alloc: 'Allocation (Director)',
    xfer: 'Budget transfer (PM approved)',
    commit: 'Purchase reserved',
    release: 'Purchase cancelled',
    pay: 'Purchase paid',
    correction: 'Correction (Director)'
  };

  /** Wallet을 갖는 역할: 최종 승인권자(PM)를 제외한 모든 역할 */
  const walletRoles = project => (project && project.roles || []).filter(r => r.function !== 'approver').map(r => r.key);

  const round = n => Math.round(Number(n) || 0);

  function balances(ledger, project) {
    const out = {};
    for (const k of walletRoles(project)) out[k] = { allocated: 0, committed: 0, actual: 0, available: 0 };
    const w = k => (out[k] = out[k] || { allocated: 0, committed: 0, actual: 0, available: 0 });
    for (const e of ledger || []) {
      const a = round(e.amount);
      if (e.type === 'alloc' || e.type === 'correction') w(e.wallet).allocated += a;
      else if (e.type === 'xfer') { w(e.from).allocated -= a; w(e.to).allocated += a; }
      else if (e.type === 'commit') w(e.wallet).committed += a;
      else if (e.type === 'release') w(e.wallet).committed -= a;
      else if (e.type === 'pay') { w(e.wallet).committed -= a; w(e.wallet).actual += a; }
    }
    for (const b of Object.values(out)) b.available = b.allocated - b.committed - b.actual;
    return out;
  }
  function totals(bal) {
    const t = { allocated: 0, committed: 0, actual: 0, available: 0 };
    for (const b of Object.values(bal)) for (const k in t) t[k] += b[k];
    return t;
  }

  const fail = msg => { const e = new Error(msg); e.walletError = true; throw e; };
  const won = n => 'KRW ' + round(n).toLocaleString('en-US');

  /**
   * 하나의 지갑 작업을 검증하고, 기록할 원장·구매 변경을 돌려줍니다.
   * ctx: { project, ledger, purchases, items, actor:{id, role, isDirector}, budget, now }
   */
  function plan(op, args, ctx) {
    const { project, ledger, purchases, items, actor } = ctx;
    const roles = walletRoles(project);
    const bal = balances(ledger, project);
    const now = ctx.now || Date.now();
    const opId = String(args.opId || '');
    if (!opId) fail('opId is required');
    if ((ledger || []).some(e => e.opId === opId) || (purchases || []).some(p => p.opId === opId)) fail('이미 처리된 요청입니다. (중복 클릭)');
    const entry = (o) => ({ id: opId + ':' + (o.type) + ':' + (o.wallet || o.from || ''), opId, projectId: project.id, ts: now, by: actor.id, ...o });

    switch (op) {
      case 'allocate': {
        if (!actor.isDirector) fail('Director만 예산을 배정할 수 있습니다.');
        const targets = args.allocations || {};
        const budget = Number(args.budget != null ? args.budget : ctx.budget);
        if (!(budget >= 0)) fail('총 예산이 올바르지 않습니다.');
        const entries = [];
        let sum = 0;
        for (const k of roles) {
          const target = round(targets[k] != null ? targets[k] : bal[k].allocated);
          if (target < 0) fail(`${k}: 금액은 0 이상이어야 합니다.`);
          if (target < bal[k].committed + bal[k].actual) fail(`${k}: 이미 사용·예약된 ${won(bal[k].committed + bal[k].actual)} 보다 작게 줄일 수 없습니다.`);
          sum += target;
          const delta = target - bal[k].allocated;
          if (delta) entries.push(entry({ type: 'alloc', wallet: k, amount: delta, memo: args.memo || 'Allocation update' }));
        }
        if (sum > budget) fail(`배정 합계 ${won(sum)} 가 총 예산 ${won(budget)} 을 넘습니다.`);
        return { ledger: entries, settings: { budget } };
      }
      case 'correction': {
        if (!actor.isDirector) fail('Director만 정정할 수 있습니다.');
        if (!roles.includes(args.wallet)) fail('Wallet을 선택하세요.');
        const amt = round(args.amount);
        if (!amt) fail('정정 금액을 입력하세요 (음수 가능).');
        if (!String(args.memo || '').trim()) fail('정정 사유를 입력하세요.');
        if (bal[args.wallet].available + amt < 0) fail('정정 후 가용액이 음수가 됩니다.');
        return { ledger: [entry({ type: 'correction', wallet: args.wallet, amount: amt, memo: args.memo })] };
      }
      case 'purchase': {
        const wallet = args.wallet;
        if (!roles.includes(wallet)) fail('Wallet이 없는 역할입니다.');
        if (!actor.isDirector && actor.role !== wallet) fail('자신의 Wallet에서만 지출할 수 있습니다.');
        const qty = Number(args.qty) || 0, unit = round(args.unitPrice);
        const total = round(args.total != null && args.total !== '' ? args.total : qty * unit);
        if (!String(args.item || '').trim()) fail('품목을 입력하세요.');
        if (!(total > 0)) fail('금액이 0보다 커야 합니다.');
        if (!String(args.reason || '').trim()) fail('비즈니스 근거(why)를 입력하세요.');
        if (total > bal[wallet].available) fail(`가용 예산 ${won(bal[wallet].available)} 을 넘습니다. 예산 이전(기안)을 먼저 요청하세요.`);
        const purchase = { id: 'po-' + opId, opId, projectId: project.id, wallet, vendorEmail: String(args.vendorEmail || '').toLowerCase(), vendorName: args.vendorName || '', item: String(args.item).trim(), qty, unitPrice: unit, total, payDate: args.payDate || '', reason: String(args.reason).trim(), status: 'Committed', by: actor.id, ts: now, history: [{ at: now, by: actor.id, action: 'Committed' }] };
        return { ledger: [entry({ type: 'commit', wallet, amount: total, ref: purchase.id, memo: purchase.item })], purchase };
      }
      case 'pay': case 'cancel': {
        const p = (purchases || []).find(x => x.id === args.purchaseId);
        if (!p) fail('구매 기록을 찾을 수 없습니다.');
        if (!actor.isDirector && actor.role !== p.wallet) fail('해당 Wallet 담당자만 처리할 수 있습니다.');
        if (p.status !== 'Committed') fail(`이미 ${p.status} 상태입니다.`);
        const status = op === 'pay' ? 'Paid' : 'Cancelled';
        return {
          ledger: [entry({ type: op === 'pay' ? 'pay' : 'release', wallet: p.wallet, amount: p.total, ref: p.id, memo: p.item })],
          purchase: { ...p, status, history: [...(p.history || []), { at: now, by: actor.id, action: status }] }
        };
      }
      case 'transfer': {
        const it = (items || []).find(i => i.id === args.itemId);
        if (!it || it.kind !== 'reallocation') fail('예산 이전 기안을 찾을 수 없습니다.');
        if (!it.decision || it.decision.result !== 'Approved') fail('PM 승인이 필요합니다.');
        if (it.transferDone) fail('이미 이전이 완료된 기안입니다.');
        if (!actor.isDirector && actor.function !== 'approver') fail('PM(최종 승인권자)만 이전을 실행할 수 있습니다.');
        const from = it.fromWallet, to = it.toWallet, amt = round(it.amountValue);
        if (!roles.includes(from) || !roles.includes(to) || from === to) fail('Wallet 정보가 올바르지 않습니다.');
        if (!(amt > 0)) fail('이전 금액이 올바르지 않습니다.');
        if (bal[from].available < amt) fail(`보내는 Wallet(${from})의 가용액 ${won(bal[from].available)} 이 부족합니다.`);
        return {
          ledger: [entry({ type: 'xfer', from, to, amount: amt, ref: it.id, memo: it.title })],
          item: { ...it, transferDone: true, transferAt: now, transferError: '', history: [...(it.history || []), { at: now, by: actor.id, action: 'Transfer executed', note: `${won(amt)} ${from} → ${to}` }] }
        };
      }
      default: fail('Unknown wallet operation: ' + op);
    }
  }

  /** 프로젝트 기본값으로 첫 배정 (Director) */
  function initialAllocations(project) {
    const def = project && project.walletAllocations || {};
    const out = {};
    for (const k of walletRoles(project)) out[k] = round(def[k] || 0);
    return out;
  }

  return { TYPES, walletRoles, balances, totals, plan, initialAllocations, won };
})();
/* ═══ END WALLET ENGINE ═══ */
/* ── 8. Project package (XLSX) import / export ─────────────
   엑셀 파일 1개 = 프로젝트 1개. 시트 이름과 1행 헤더로 읽습니다(대소문자·공백 무관). */
const XLSX_SCHEMA = [
  { sheet: 'Project_Info', required: true, cols: ['key', 'value'], help: 'name*, client*, goal*, product, summary, weeks, start_date (YYYY-MM-DD), budget, currency, project_id. 그 외 key는 "Project facts"로 표시' },
  { sheet: 'Client_Profile', cols: ['key', 'value'], help: '고객사 소개 (Directory에 표시)' },
  { sheet: 'Roles', required: true, cols: ['key', 'title', 'group', 'headcount', 'function', 'responsibilities', 'english_target'], help: 'function: approver(PM 1명) · coordinator · member' },
  { sheet: 'Weeks', required: true, cols: ['week', 'title', 'key_decision', 'english_behavior', 'meeting'], help: '주차별 핵심 결정' },
  { sheet: 'Weekly_Missions', required: true, cols: ['week', 'role', 'mission', 'ask'], help: 'role: Roles.key 또는 all · ask = 요청해야 할 정보' },
  { sheet: 'Role_Briefs', cols: ['week', 'role', 'info'], help: '역할별 비공개 정보 (해당 역할에게만 표시)' },
  { sheet: 'Deliverables', cols: ['week', 'role', 'title', 'description'], help: '역할별 산출물 · role: all 이면 전원 개별 제출' },
  { sheet: 'Stakeholders', cols: ['name', 'title', 'company', 'email', 'type', 'reply'], help: '가상 거래처 · reply = 자동 회신 문구' },
  { sheet: 'Email_Scenarios', cols: ['key', 'week', 'from', 'to_roles', 'subject', 'body'], help: 'from: Stakeholders.email 또는 Director 이메일 · to_roles: all 또는 역할 key (쉼표로 여러 개)' },
  { sheet: 'Vendors', cols: null, help: '자유 형식 표 (1행 = 열 이름). Directory에 그대로 표시' },
  { sheet: 'Evaluation', cols: ['dimension', 'weight', 'description'], help: '평가 항목과 가중치(합 100)' },
  { sheet: 'Wallets', cols: ['role', 'allocation'], help: '역할별 기본 Wallet 배정액(KRW). approver(PM)는 Wallet 없음. Director가 화면에서 언제든 조정 가능' },
  { sheet: 'NPC_Rules', cols: ['email', 'key', 'value'], help: '가상 거래처 응답 규칙(비공개). kind(supplier·logistics·agency·channel·customer), unit_price, moq, lead_time_weeks, discount_threshold, discount_rate, discount_from_week, variant:500 ml, finish:premium coating, reply_delay_minutes, template:quote 등' },
  { sheet: 'Email_Missions', cols: ['mission_id', 'week', 'sender_role', 'title', 'description', 'email_type', 'expected_recipient', 'required_facts', 'required_actions', 'approval_required'], help: '이메일 평가 미션. required_facts 한 줄에 하나: 이름 | type(quantity·currency·percent·volume·text) | 값(any 가능) | 가중치 | 동의어. required_actions: request_quotation:3; request_lead_time:2' }
];
const NPC_KINDS = ['supplier', 'logistics', 'agency', 'channel', 'customer'];
const EMAIL_TYPES = ['INFORMATION_REQUEST', 'STATUS_UPDATE', 'PROPOSAL', 'NEGOTIATION', 'APPROVAL_REQUEST', 'DECISION_NOTIFICATION'];
const NPC_NUMERIC = ['unit_price', 'moq', 'lead_time_weeks', 'discount_threshold', 'discount_rate', 'discount_from_week', 'sample_days', 'packaging_per_unit', 'shipping_per_order', 'delay_from_week', 'metrics_from_week', 'commission_pct', 'settlement_days', 'price_limit', 'reply_delay_minutes'];
const camel = k => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const SHEET_ALIASES = { hidden_information: 'role_briefs', missions: 'weekly_missions', email_events: 'email_scenarios', timeline: 'weeks' };
const ROLE_FUNCTIONS = ['approver', 'coordinator', 'member'];
const hdr = s => norm(s).replace(/[\s\-]+/g, '_');

let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxLoading) return xlsxLoading;
  xlsxLoading = new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = CONFIG.XLSX_LIB; s.async = true;
    s.onload = () => window.XLSX ? ok(window.XLSX) : no(Error('엑셀 라이브러리를 불러오지 못했습니다.'));
    s.onerror = () => { xlsxLoading = null; no(Error('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}

/** File → { project, errors[], warnings[], stats } */
async function parseProjectFile(file) {
  if (!/\.(xlsx|xlsm|xls)$/i.test(file.name)) throw Error('.xlsx 파일만 올릴 수 있습니다.');
  const XLSX = await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const sheets = {};
  for (const name of wb.SheetNames) {
    const key = SHEET_ALIASES[hdr(name)] || hdr(name);
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false, blankrows: false });
    sheets[key] = aoa.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(c => c !== ''));
  }
  return buildProjectFromSheets(sheets, file.name);
}

function rowsOf(sheets, name) {
  const aoa = sheets[hdr(name)]; if (!aoa || !aoa.length) return null;
  const head = aoa[0].map(hdr);
  return aoa.slice(1).map((r, i) => ({ _row: i + 2, ...Object.fromEntries(head.map((h, j) => [h, r[j] ?? ''])) }));
}

function buildProjectFromSheets(sheets, fileName = '') {
  const errors = [], warnings = [];
  const err = (sheet, row, msg) => errors.push(`[${sheet}${row ? ' ' + row + '행' : ''}] ${msg}`);
  const warn = (sheet, row, msg) => warnings.push(`[${sheet}${row ? ' ' + row + '행' : ''}] ${msg}`);
  for (const s of XLSX_SCHEMA.filter(s => s.required)) if (!rowsOf(sheets, s.sheet)) err(s.sheet, 0, '필수 시트가 없거나 비어 있습니다.');
  if (errors.length) return { project: null, errors, warnings, stats: {} };

  /* Project_Info */
  const infoRows = rowsOf(sheets, 'Project_Info');
  const kv = {}; const facts = [];
  const KNOWN = ['project_id', 'name', 'client', 'product', 'summary', 'goal', 'weeks', 'start_date', 'budget', 'currency', 'reply_delay_minutes'];
  for (const r of infoRows) { const k = hdr(r.key); if (!k) continue; if (KNOWN.includes(k)) kv[k] = r.value; else facts.push([r.key, r.value]); }
  if (!kv.name) err('Project_Info', 0, 'name 이 필요합니다.');
  if (!kv.client) err('Project_Info', 0, 'client 가 필요합니다.');
  if (!kv.goal) err('Project_Info', 0, 'goal 이 필요합니다.');
  const weeksCount = Number(kv.weeks || 8);
  if (!Number.isInteger(weeksCount) || weeksCount < 1 || weeksCount > 20) err('Project_Info', 0, 'weeks 는 1~20 사이 정수여야 합니다.');
  if (kv.start_date && isNaN(new Date(kv.start_date))) err('Project_Info', 0, 'start_date 형식은 YYYY-MM-DD 입니다.');
  const budget = kv.budget ? Number(String(kv.budget).replace(/[^\d.]/g, '')) : null;

  /* Roles */
  const roles = [];
  for (const r of rowsOf(sheets, 'Roles')) {
    const key = norm(r.key).replace(/\s+/g, '_');
    if (!key) { err('Roles', r._row, 'key 가 비어 있습니다.'); continue; }
    if (!/^[a-z0-9_]+$/.test(key)) err('Roles', r._row, `key "${r.key}" 는 영문 소문자·숫자·_ 만 쓸 수 있습니다.`);
    if (key === 'all' || key === 'director') err('Roles', r._row, `"${key}" 는 예약어라 역할 key로 쓸 수 없습니다.`);
    if (roles.some(x => x.key === key)) err('Roles', r._row, `중복된 key: ${key}`);
    if (!r.title) err('Roles', r._row, 'title 이 비어 있습니다.');
    const fn = norm(r.function) || (key === 'pm' ? 'approver' : key === 'coordinator' ? 'coordinator' : 'member');
    if (!ROLE_FUNCTIONS.includes(fn)) err('Roles', r._row, `function 은 ${ROLE_FUNCTIONS.join(' / ')} 중 하나여야 합니다.`);
    roles.push({ key, title: r.title, group: r.group || 'Team', headcount: Number(r.headcount) || 1, function: fn, responsibilities: r.responsibilities || '', english: r.english_target || '' });
  }
  const approvers = roles.filter(r => r.function === 'approver');
  if (approvers.length !== 1) err('Roles', 0, `approver(최종 승인권자) 역할은 정확히 1개여야 합니다. 현재 ${approvers.length}개.`);
  if (!roles.some(r => r.function === 'coordinator')) warn('Roles', 0, 'coordinator 역할이 없습니다. 요청이 PM에게 바로 전달됩니다.');
  const roleKeys = new Set(roles.map(r => r.key));
  const checkRole = (sheet, row, v, allowAll = true) => {
    const k = norm(v);
    if (allowAll && k === 'all') return 'all';
    if (!roleKeys.has(k)) { err(sheet, row, `역할 "${v}" 이(가) Roles 시트에 없습니다.`); return null; }
    return k;
  };
  const checkWeek = (sheet, row, v) => {
    const n = Number(v);
    if (!Number.isInteger(n) || n < 1 || n > weeksCount) { err(sheet, row, `week "${v}" 는 1~${weeksCount} 사이여야 합니다.`); return null; }
    return n;
  };

  /* Weeks */
  const weeks = [];
  for (const r of rowsOf(sheets, 'Weeks')) {
    const n = checkWeek('Weeks', r._row, r.week); if (n == null) continue;
    if (weeks.some(w => w.week === n)) err('Weeks', r._row, `Week ${n} 이(가) 중복됩니다.`);
    if (!r.title) err('Weeks', r._row, 'title 이 비어 있습니다.');
    weeks.push({ week: n, title: r.title, decision: r.key_decision || '', english: r.english_behavior || '', meeting: r.meeting || '' });
  }
  for (let n = 1; n <= weeksCount; n++) if (!weeks.some(w => w.week === n)) err('Weeks', 0, `Week ${n} 행이 없습니다.`);
  weeks.sort((a, b) => a.week - b.week);

  /* Missions */
  const missions = [];
  for (const r of rowsOf(sheets, 'Weekly_Missions')) {
    const n = checkWeek('Weekly_Missions', r._row, r.week), role = checkRole('Weekly_Missions', r._row, r.role);
    if (!r.mission) err('Weekly_Missions', r._row, 'mission 이 비어 있습니다.');
    if (n != null && role) missions.push({ week: n, role, mission: r.mission, ask: r.ask || '' });
  }
  for (let n = 1; n <= weeksCount; n++) for (const rl of roles) if (!missions.some(m => m.week === n && (m.role === rl.key || m.role === 'all'))) warn('Weekly_Missions', 0, `Week ${n} · ${rl.key} 미션이 없습니다.`);

  /* Optional sheets */
  const briefs = [];
  for (const r of rowsOf(sheets, 'Role_Briefs') || []) {
    const n = checkWeek('Role_Briefs', r._row, r.week), role = checkRole('Role_Briefs', r._row, r.role);
    if (!r.info) { err('Role_Briefs', r._row, 'info 가 비어 있습니다.'); continue; }
    if (n != null && role) briefs.push({ week: n, role, info: r.info });
  }
  const deliverables = [];
  for (const r of rowsOf(sheets, 'Deliverables') || []) {
    const n = checkWeek('Deliverables', r._row, r.week), role = checkRole('Deliverables', r._row, r.role);
    if (!r.title) { err('Deliverables', r._row, 'title 이 비어 있습니다.'); continue; }
    if (n != null && role) {
      if (deliverables.some(d => d.week === n && d.role === role && slug(d.title) === slug(r.title))) err('Deliverables', r._row, `같은 주차·역할에 중복된 산출물: ${r.title}`);
      deliverables.push({ week: n, role, title: r.title, description: r.description || '' });
    }
  }
  const stakeholders = [];
  for (const r of rowsOf(sheets, 'Stakeholders') || []) {
    const email = norm(r.email);
    if (!r.name) err('Stakeholders', r._row, 'name 이 비어 있습니다.');
    if (!isEmail(email)) { err('Stakeholders', r._row, `이메일 형식 오류: ${r.email}`); continue; }
    if (email.endsWith('@worqend.com')) err('Stakeholders', r._row, '@worqend.com 은 참가자 전용 도메인입니다.');
    if (stakeholders.some(s => s.email === email)) err('Stakeholders', r._row, `중복된 이메일: ${email}`);
    stakeholders.push({ name: r.name, title: r.title || '', company: r.company || '', email, type: r.type || '', reply: r.reply || '' });
  }
  const events = [];
  for (const r of rowsOf(sheets, 'Email_Scenarios') || []) {
    const key = slug(r.key || r.subject);
    const n = checkWeek('Email_Scenarios', r._row, r.week);
    const from = norm(r.from);
    if (!stakeholders.some(s => s.email === from) && from !== norm(DIRECTOR.email)) err('Email_Scenarios', r._row, `from "${r.from}" 은(는) Stakeholders 이메일 또는 Director 이메일(${DIRECTOR.email})이어야 합니다.`);
    const to = String(r.to_roles || 'all').split(/[,;]/).map(norm).filter(Boolean);
    for (const t of to) if (t !== 'all' && !roleKeys.has(t)) err('Email_Scenarios', r._row, `to_roles 의 "${t}" 이(가) Roles 에 없습니다.`);
    if (!r.subject || !r.body) err('Email_Scenarios', r._row, 'subject 와 body 가 필요합니다.');
    if (events.some(e => e.key === key)) err('Email_Scenarios', r._row, `중복된 key: ${key}`);
    if (n != null) events.push({ key, week: n, from, to: to.join(','), subject: r.subject, body: r.body });
  }
  let vendors = null;
  const vAoa = sheets.vendors;
  if (vAoa && vAoa.length) vendors = { columns: vAoa[0], rows: vAoa.slice(1) };
  const evaluation = [];
  for (const r of rowsOf(sheets, 'Evaluation') || []) {
    const w = Number(r.weight);
    if (!r.dimension) continue;
    if (!(w >= 0)) err('Evaluation', r._row, `weight 숫자 오류: ${r.weight}`);
    evaluation.push({ dimension: r.dimension, weight: w || 0, description: r.description || '' });
  }
  if (evaluation.length) { const sum = evaluation.reduce((s, e) => s + e.weight, 0); if (sum !== 100) warn('Evaluation', 0, `가중치 합이 ${sum} 입니다 (권장 100).`); }
  const clientProfile = (rowsOf(sheets, 'Client_Profile') || []).filter(r => r.key).map(r => [r.key, r.value]);
  /* Wallets */
  const walletAllocations = {};
  for (const r of rowsOf(sheets, 'Wallets') || []) {
    const k = norm(r.role); if (!k) continue;
    if (!roleKeys.has(k)) { err('Wallets', r._row, `역할 "${r.role}" 이(가) Roles 에 없습니다.`); continue; }
    if (roles.find(x => x.key === k)?.function === 'approver') { warn('Wallets', r._row, `${k} 는 최종 승인권자라 Wallet이 없습니다. 무시합니다.`); continue; }
    const v = Number(String(r.allocation).replace(/[^\d.]/g, ''));
    if (!(v >= 0)) err('Wallets', r._row, `allocation 숫자 오류: ${r.allocation}`); else walletAllocations[k] = v;
  }
  if (budget != null && Object.values(walletAllocations).reduce((a, b) => a + b, 0) > budget) err('Wallets', 0, '배정 합계가 Project_Info 의 budget 을 넘습니다.');
  /* NPC_Rules */
  const npcs = {};
  for (const r of rowsOf(sheets, 'NPC_Rules') || []) {
    const email = norm(r.email), key = String(r.key || '').trim(), kl = hdr(key.split(':')[0]);
    if (!email || !key) continue;
    if (!stakeholders.some(s => s.email === email)) { err('NPC_Rules', r._row, `${r.email} 이(가) Stakeholders 에 없습니다.`); continue; }
    const n = npcs[email] = npcs[email] || { kind: 'supplier', style: 'formal' };
    const sub = key.includes(':') ? key.slice(key.indexOf(':') + 1).trim() : '';
    const num = Number(String(r.value).replace(/[^\d.\-]/g, ''));
    if (kl === 'variant') (n.variants = n.variants || {})[sub] = num || 0;
    else if (kl === 'finish') (n.finishes = n.finishes || {})[sub] = num || 0;
    else if (kl === 'opinion') (n.opinions = n.opinions || {})[sub] = r.value;
    else if (kl === 'result') (n.results = n.results || []).push({ fromWeek: Number(sub) || 1, text: r.value });
    else if (kl === 'template') (n.templates = n.templates || {})[sub] = r.value;
    else if (NPC_NUMERIC.includes(kl)) { if (r.value === '' || isNaN(num)) err('NPC_Rules', r._row, `${key} 는 숫자여야 합니다.`); else n[camel(kl)] = num; }
    else if (kl === 'kind') { if (!NPC_KINDS.includes(norm(r.value))) err('NPC_Rules', r._row, `kind 는 ${NPC_KINDS.join(' / ')} 중 하나`); n.kind = norm(r.value); }
    else n[camel(kl)] = r.value;
  }
  for (const n of Object.values(npcs)) if (n.discountRate > 1) n.discountRate = n.discountRate / 100;
  for (const s of stakeholders) if (!npcs[s.email]) warn('NPC_Rules', 0, `${s.email} 응답 규칙이 없습니다. 자동 회신 없이 메일만 받습니다.`);

  /* Email_Missions */
  const emailMissions = [];
  for (const r of rowsOf(sheets, 'Email_Missions') || []) {
    const id = String(r.mission_id || '').trim();
    if (!id) { err('Email_Missions', r._row, 'mission_id 가 비어 있습니다.'); continue; }
    if (emailMissions.some(m => m.mission_id === id)) err('Email_Missions', r._row, `중복된 mission_id: ${id}`);
    const n = checkWeek('Email_Missions', r._row, r.week), role = checkRole('Email_Missions', r._row, r.sender_role, false);
    const type = String(r.email_type || '').trim().toUpperCase();
    if (!EMAIL_TYPES.includes(type)) err('Email_Missions', r._row, `email_type 은 ${EMAIL_TYPES.join(', ')} 중 하나`);
    const facts = String(r.required_facts || '').split(/\n|;/).map(x => x.trim()).filter(Boolean).map((line, i) => {
      const [label, type, value, weight, syn] = line.split('|').map(x => (x || '').trim());
      const tp = norm(type || 'text');
      if (!['quantity', 'currency', 'percent', 'volume', 'text', 'number'].includes(tp)) err('Email_Missions', r._row, `fact "${label}" type 오류: ${type}`);
      const val = !value || norm(value) === 'any' ? null : (tp === 'text' ? value : Number(String(value).replace(/[^\d.]/g, '')));
      if (tp === 'text' && !val) err('Email_Missions', r._row, `text fact "${label}" 에 값이 필요합니다.`);
      return { id: slug(label) || 'fact' + i, label, type: tp, value: val, weight: Number(weight) || 1, synonyms: syn ? syn.split(',').map(x => x.trim()).filter(Boolean) : [] };
    });
    const actions = String(r.required_actions || '').split(/[;\n,]/).map(x => x.trim()).filter(Boolean).map(x => { const [aid, w] = x.split(':'); return { id: aid.trim(), weight: Number(w) || 1 }; });
    for (const a of actions) if (typeof AssessEngine !== 'undefined' && !AssessEngine.RUBRIC.actions[a.id]) err('Email_Missions', r._row, `알 수 없는 action: ${a.id} (가능: ${Object.keys(AssessEngine.RUBRIC.actions).join(', ')})`);
    const exp = String(r.expected_recipient || '').trim();
    for (const o of exp.split('|').map(x => x.trim()).filter(Boolean)) {
      if (o.startsWith('role:') && !roleKeys.has(norm(o.slice(5)))) err('Email_Missions', r._row, `expected_recipient 역할 없음: ${o}`);
      if (o.startsWith('email:') && !stakeholders.some(s => s.email === norm(o.slice(6)))) warn('Email_Missions', r._row, `expected_recipient 이메일이 Stakeholders 에 없습니다: ${o}`);
    }
    if (n != null && role) emailMissions.push({ mission_id: id, week: n, sender_role: role, title: r.title || id, description: r.description || '', email_type: type, expected_recipient: exp, required_facts: facts, required_actions: actions, approval_required: /^(y|yes|true|1|o)$/i.test(String(r.approval_required).trim()) });
  }

  const id = slug(kv.project_id || kv.name) ;
  const project = errors.length ? null : {
    id: id || 'project-' + Date.now().toString(36), source: 'xlsx', fileName,
    name: kv.name, client: kv.client, product: kv.product || '', summary: kv.summary || '', goal: kv.goal,
    weeksCount, startDate: kv.start_date || '', budget, currency: kv.currency || '',
    info: facts, clientProfile, roles, weeks, missions, briefs, deliverables, stakeholders, events,
    vendors, evaluation: evaluation.length ? evaluation : MORROW.evaluation.map(e => ({ ...e })),
    walletAllocations, npcs, npcSettings: { replyDelayMinutes: Number(kv.reply_delay_minutes) || 0 }, emailMissions
  };
  return { project, errors, warnings, stats: { roles: roles.length, weeks: weeks.length, missions: missions.length, briefs: briefs.length, deliverables: deliverables.length, stakeholders: stakeholders.length, events: events.length, npcs: Object.keys(npcs).length, emailMissions: emailMissions.length } };
}

/** Project → workbook (템플릿 다운로드 · 재업로드 가능한 동일 형식) */
function projectToSheets(p) {
  return {
    Project_Info: [['key', 'value'], ['project_id', p.id], ['name', p.name], ['client', p.client], ['product', p.product || ''], ['summary', p.summary || ''], ['goal', p.goal], ['weeks', p.weeksCount || p.weeks.length], ['start_date', p.startDate || ''], ['budget', p.budget ?? ''], ['currency', p.currency || ''], ['reply_delay_minutes', p.npcSettings?.replyDelayMinutes ?? 0], ...(p.info || [])],
    Client_Profile: [['key', 'value'], ...(p.clientProfile || [])],
    Roles: [['key', 'title', 'group', 'headcount', 'function', 'responsibilities', 'english_target'], ...p.roles.map(r => [r.key, r.title, r.group, r.headcount, r.function, r.responsibilities, r.english])],
    Weeks: [['week', 'title', 'key_decision', 'english_behavior', 'meeting'], ...p.weeks.map(w => [w.week, w.title, w.decision, w.english, w.meeting])],
    Weekly_Missions: [['week', 'role', 'mission', 'ask'], ...p.missions.map(m => [m.week, m.role, m.mission, m.ask || ''])],
    Role_Briefs: [['week', 'role', 'info'], ...(p.briefs || []).map(b => [b.week, b.role, b.info])],
    Deliverables: [['week', 'role', 'title', 'description'], ...(p.deliverables || []).map(d => [d.week, d.role, d.title, d.description || ''])],
    Stakeholders: [['name', 'title', 'company', 'email', 'type', 'reply'], ...(p.stakeholders || []).map(s => [s.name, s.title, s.company, s.email, s.type, s.reply])],
    Email_Scenarios: [['key', 'week', 'from', 'to_roles', 'subject', 'body'], ...(p.events || []).map(e => [e.key, e.week, e.from, e.to, e.subject, e.body])],
    Vendors: p.vendors ? [p.vendors.columns, ...p.vendors.rows] : [['Name', 'Notes']],
    Evaluation: [['dimension', 'weight', 'description'], ...(p.evaluation || []).map(e => [e.dimension, e.weight, e.description])],
    Wallets: [['role', 'allocation'], ...Object.entries(p.walletAllocations || {})],
    NPC_Rules: [['email', 'key', 'value'], ...npcRows(p.npcs || {})],
    Email_Missions: [['mission_id', 'week', 'sender_role', 'title', 'description', 'email_type', 'expected_recipient', 'required_facts', 'required_actions', 'approval_required'], ...(p.emailMissions || []).map(m => [m.mission_id, m.week, m.sender_role, m.title, m.description, m.email_type, m.expected_recipient, m.required_facts.map(f => [f.label, f.type, f.value == null ? 'any' : f.value, f.weight, (f.synonyms || []).join(', ')].join(' | ')).join('\n'), m.required_actions.map(a => `${a.id}:${a.weight}`).join('; '), m.approval_required ? 'yes' : 'no'])]
  };
}
function npcRows(npcs) {
  const snake = k => k.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
  const rows = [];
  for (const [email, n] of Object.entries(npcs)) for (const [k, v] of Object.entries(n)) {
    if (k === 'variants' || k === 'finishes' || k === 'opinions' || k === 'templates') for (const [sk, sv] of Object.entries(v || {})) rows.push([email, `${{ variants: 'variant', finishes: 'finish', opinions: 'opinion', templates: 'template' }[k]}:${sk}`, sv]);
    else if (k === 'results') (v || []).forEach(r => rows.push([email, `result:${r.fromWeek}`, r.text]));
    else if (v != null) rows.push([email, snake(k), v]);
  }
  return rows;
}
async function downloadProjectXlsx(p) {
  const XLSX = await loadXLSX();
  const wb = XLSX.utils.book_new();
  const widths = { Project_Info: [18, 90], Roles: [14, 24, 24, 10, 12, 70, 22], Weeks: [6, 36, 60, 50, 26], Weekly_Missions: [6, 14, 90, 50], Role_Briefs: [6, 14, 100], Deliverables: [6, 14, 30, 60], Stakeholders: [16, 22, 34, 30, 12, 90], Email_Scenarios: [20, 6, 28, 18, 36, 90], Evaluation: [30, 8, 80], Client_Profile: [18, 90], NPC_Rules: [30, 26, 90], Wallets: [16, 16], Email_Missions: [26, 6, 13, 30, 60, 22, 40, 70, 50, 10] };
  for (const [name, aoa] of Object.entries(projectToSheets(p))) {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = (widths[name] || []).map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  }
  XLSX.writeFile(wb, `Worqend_Project_${slug(p.name)}.xlsx`);
}

  Overlay.open(it ? 'Edit request' : 'New request / report', `${notice(isCoord() || isPM() ? '항목은 상태 흐름(Draft → Submitted → Reviewed → Decided → Completed)을 따릅니다.' : '모든 요청·보고는 Executive Coordinator에게 먼저 전달되고, 승인 사항은 PM이 결정합니다.')}
  <form data-form="item-save" data-id="${esc(it?.id || '')}">
    <div class="field"><label>Type</label><select name="kind">${kinds.map(([k, v]) => `<option value="${k}" ${f.kind === k ? 'selected' : ''}>${v.label} · ${v.ko}</option>`).join('')}</select></div>
    <div class="field"><label>What (title)</label><input name="title" required maxlength="140" value="${esc(f.title || '')}" placeholder="e.g. Budget transfer for premium coating"></div>

    <div class="field-row"><div class="field"><label>Needs input from (role)</label><select name="relatedRole"><option value="">—</option>${project().roles.map(r => `<option value="${r.key}" ${f.relatedRole === r.key ? 'selected' : ''}>${esc(r.title)}</option>`).join('')}</select></div><div class="field"><label>Amount (if any)</label><input name="amount" value="${esc(f.amount || '')}" placeholder="KRW 1,200,000"></div></div>
    <div class="error" data-error></div>

  </form>`);
}
function openItem(id) {
  const it = itemById(id); if (!it) return;
  const isAuthor = it.authorId === me.id;
  const actions = [];
  if (isAuthor && it.status === 'Draft') actions.push(btn('Edit', 'item-edit', { id }), btn('Delete', 'item-act', { id, a: 'delete' }, 'danger'));
  if (isCoord() && it.status === 'Submitted' && it.kind !== 'director_report') actions.push('coord');
  if (isPM() && pmQueue().some(x => x.id === id)) actions.push('pm');
  if ((isCoord() || (isPM() && !coordinatorExists())) && it.status === 'Decided') actions.push('complete');
  if (isDirector() && it.kind === 'director_report' && it.status === 'Submitted') actions.push('director');
  const noteForm = (opts) => `<form data-form="item-act" data-id="${esc(id)}"><div class="field"><label>${opts.label}</label><textarea name="note" placeholder="${opts.ph}"></textarea></div><div class="error" data-error></div><div class="btn-row end">${opts.buttons}</div></form>`;
  let actionHtml = actions.filter(a => typeof a === 'string' && a.startsWith('<')).join('');
  if (actions.includes('coord')) actionHtml += noteForm({ label: 'Coordinator note / summary for PM', ph: 'Summarize the request, agreements and remaining budget', buttons: '<button class="btn" name="a" value="return">Return (missing info)</button><button class="btn" name="a" value="close">Close (no decision needed)</button><button class="btn primary" name="a" value="forward">Forward to PM</button>' });
  if (actions.includes('pm')) actionHtml += noteForm({ label: 'Decision reason (English)', ph: 'Why you approve or reject', buttons: '<button class="btn" name="a" value="return">Return</button><button class="btn" name="a" value="note">Noted</button><button class="btn danger" name="a" value="reject">Reject</button><button class="btn primary" name="a" value="approve">Approve</button>' });
  if (actions.includes('complete')) actionHtml += noteForm({ label: 'How the decision was communicated', ph: 'e.g. Shared with Procurement and Finance by email', buttons: '<button class="btn primary" name="a" value="complete">Mark completed</button>' });
  if (actions.includes('director')) actionHtml += noteForm({ label: 'Director feedback', ph: 'Feedback to the PM', buttons: '<button class="btn primary" name="a" value="director-review">Mark reviewed</button>' });
  Overlay.open(it.title, `<div class="chips">${statusChip(it.status)}${chip(ITEM_KINDS[it.kind].label)}${chip('W' + it.week)}</div>
  ${www({ who: `${nameOf(it.authorId)} (${roleTitle(accountById(it.authorId)?.role)})`, what: it.title, when: it.due ? fmtDay(it.due) : 'Not set', why: it.body })}
  ${it.kind === 'reallocation' ? (() => { const bal = walletBalances(); const showBal = canSeeAllWallets(); return `<div class="xfer-box"><div><small>FROM</small><b>${esc(roleTitle(it.fromWallet))}</b>${showBal && bal[it.fromWallet] ? `<span>available ${won(bal[it.fromWallet].available)}</span>` : ''}</div><div class="xfer-arrow">→ ${won(it.amountValue)} →</div><div><small>TO</small><b>${esc(roleTitle(it.toWallet))}</b>${showBal && bal[it.toWallet] ? `<span>available ${won(bal[it.toWallet].available)}</span>` : ''}</div></div>${it.transferDone ? notice('✓ 이전 완료 · ' + esc(fmt(it.transferAt))) : it.transferError ? notice('⚠ ' + esc(it.transferError), 'warn') : ''}${it.decision?.result === 'Approved' && !it.transferDone && (isPM() || isDirector()) ? `<div class="btn-row">${btn('Retry transfer', 'xfer-run', { id: it.id }, 'primary')}</div>` : ''}${kv([['Agreement', it.agreement], ['Meeting', it.meetingId ? meetingById(it.meetingId)?.title : '']])}`; })() : ''}
  ${kv([['Needs input from', it.relatedRole ? roleTitle(it.relatedRole) : ''], ['Amount', it.amount], ['Returned', it.returnNote], ['Coordinator note', it.coordinatorNote], ['Decision', it.decision ? `${it.decision.result} — ${it.decision.note || ''} (${nameOf(it.decision.by)})` : ''], ['Closing note', it.closeNote], ['Director feedback', it.directorFeedback]])}
  <details><summary>History (${(it.history || []).length})</summary>${(it.history || []).map(h => `<div class="tiny muted">${esc(fmt(h.at))} · ${esc(nameOf(h.by))} · ${esc(h.action)}${h.note ? ' — ' + esc(h.note) : ''}</div>`).join('')}</details>
  ${actionHtml}`);
}

/* Coordinator inbox */

  const p = project(); if (!p) return noProject();
  const w = week();
  const its = pitems().filter(i => i.kind !== 'director_report');
  const group = (title, arr, hint) => `${sectionTitle(`${title} (${arr.length})`, hint ? `<span class="muted tiny">${hint}</span>` : '')}${list(arr.map(i => listRow({ title: i.title, sub: `${nameOf(i.authorId)} · ${roleTitle(accountById(i.authorId)?.role)} · ${ITEM_KINDS[i.kind].label}${i.due ? ' · by ' + fmtDay(i.due) : ''}`, right: statusChip(i.status), act: 'item-open', data: { id: i.id } })), 'Nothing here.')}`;
  const missing = deliverableSlots().filter(s => s.week <= w && !['Submitted', 'Reviewed', 'Completed'].includes(deliverableStatus(s.key)));
  return `${!isCoord() ? notice('Director 보기 전용 화면입니다. 처리는 Executive Coordinator가 합니다.') : notice('당신은 팀의 공식 소통 창구입니다. 제출된 요청을 확인해 PM에게 전달하거나 보완을 요청하고, PM의 결정을 팀에 전달한 뒤 완료 처리하세요.')}

  ${group('New submissions', its.filter(i => i.status === 'Submitted'), 'Review → forward / return / close')}

  ${group('Waiting for PM decision', its.filter(i => i.status === 'Reviewed'))}

  ${sectionTitle(`Missing deliverables up to W${w} (${missing.length})`)}
  ${list(missing.map(s => { const owners = membersOfRole(s.role); return listRow({ title: `W${s.week} · ${s.title}`, sub: `${roleTitle(s.role)} · ${owners.map(o => o.name).join(', ') || 'Unassigned'} · ${deliverableStatus(s.key)}`, right: owners[0] && isCoord() ? btn('Remind', 'compose', { to: owners[0].email, subject: `Reminder: ${s.title} (Week ${s.week})` }, 'small') : '' }); }), 'All deliverables are in.')}

/* Email */
function pageMail() {
  const p = project(); if (!p) return noProject();
  const boxes = { inbox: inbox(), sent: sent(), trash: trash() };
  const mails = boxes[ui.mailbox] || [];
  const seg = `<div class="seg">${[['inbox', 'Inbox'], ['sent', 'Sent'], ['trash', 'Trash']].map(([k, l]) => `<button type="button" class="${ui.mailbox === k ? 'active' : ''}" data-act="mailbox" data-box="${k}">${l} ${boxes[k].length}</button>`).join('')}</div>`;
  const who = m => ui.mailbox === 'sent' || (ui.mailbox === 'trash' && norm(m.from) === norm(me.email)) ? 'To: ' + displayName(m.to) + ((m.cc || []).length ? ` +${m.cc.length}` : '') : displayName(m.from);
  const row = m => { const a = mailAssessment(m.id); return `<button type="button" class="mail-item ${m.id === ui.selectedMail ? 'selected' : ''}" data-act="mail-open" data-id="${esc(m.id)}"><div class="avatar ${stakeholderByEmail(m.from) ? 'ext' : ''}">${esc(initials(displayName(norm(m.from) === norm(me.email) ? m.to : m.from)))}</div><div class="row-main"><b>${esc(who(m))}</b><span>${esc(m.subject)}</span></div><div class="row-right"><small>${esc(fmt(m.deliverAt || m.ts))}</small>${a ? chip(String(a.score), 'st-completed') : ''}</div></button>`; };
  const listHtml = `<div class="mail-list">${mails.length ? mails.map(row).join('') : empty(ui.mailbox === 'trash' ? 'Trash is empty.' : 'No messages yet.')}</div>`;
  if (VIEW === 'mobile') return `${seg}${listHtml}<p class="tiny muted pad">Worqend 내부 이메일입니다. 가상 거래처는 규칙 기반으로 자동 회신합니다(AI 아님).</p>`;

    $('sideName').textContent = me.name;
    $('sideRole').textContent = roleLabel() + ' · ' + me.email;
    $('roleTag').textContent = roleLabel().toUpperCase();
    $('projectSwitch').innerHTML = isDirector() ? `<select data-change="project" class="project-select">${allProjects().map(p => `<option value="${esc(p.id)}" ${p.id === currentProjectId() ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : `<div class="project-name">${esc(project()?.name || 'No project')}</div>`;
    $('pageTitle').textContent = page.title;
    $('crumb').textContent = `${(project()?.client || 'WORQEND').toUpperCase()} / ${page.label.toUpperCase()}`;
    const a = page.action && page.action();
    $('pageAction').innerHTML = a ? btn(a.label, a.act, a.data || {}, 'primary small') : '';
  }
};
const MobileShell = {
  chrome(key, page) {
    const parent = page.mobileOnly || MOBILE_TABS().some(t => t.key === key) ? null : 'more';
    $('pageTitle').textContent = page.title;
    $('crumb').textContent = `${(project()?.client || 'WORQEND').toUpperCase()} · W${project() ? week() : '-'}`;
    $('backBtn').classList.toggle('hide', !parent);
    const a = page.action && page.action();
    $('fab').classList.toggle('hide', !a);
    if (a) { $('fab').textContent = a.label; $('fab').dataset.act = a.act; }
    const active = parent || key;
    $('tabbar').innerHTML = MOBILE_TABS().map(t => { const b = t.badge ? t.badge() : 0; return `<button type="button" class="${active === t.key ? 'active' : ''}" data-act="nav" data-tab="${t.key}"><span class="ico">${t.ico}</span>${t.label}${b ? `<span class="badge">${b > 99 ? '99+' : b}</span>` : ''}</button>`; }).join('');
  }
};
let Shell = PCShell;

function render(scrollTop = true) {
  if (!me) return;
  let page = PAGES[ui.tab];
  if (!page || (page.when && !page.when()) || (page.mobileOnly && VIEW !== 'mobile')) { ui.tab = 'overview'; page = PAGES.overview; }
  Shell.chrome(ui.tab, page);
  try { $('content').innerHTML = page.render(); } catch (e) { console.error(e); $('content').innerHTML = notice('화면을 그리는 중 오류가 발생했습니다: ' + esc(e.message)); }
  if (scrollTop) window.scrollTo(0, 0);
}
function navigate(tab) {
  ui.tab = tab; render();
  if (isStale()) sync().then(() => { if (me && ui.tab === tab && !Overlay.isOpen) render(false); }).catch(e => console.warn('Background sync:', e));
}
function showApp() { $('login').classList.add('hide'); $('app').classList.remove('hide'); navigate(isDirector() ? 'director' : 'overview'); }

hooks.status = t => { const el = $('syncState'); if (el) el.textContent = t; };
hooks.changed = () => {
  render(false);
  if (ui.chatWith && $('chatLog')) { $('chatLog').innerHTML = renderChatLog(ui.chatWith); $('chatLog').scrollTop = $('chatLog').scrollHeight; }
};
hooks.signedOut = () => { Overlay.close(); closeDialog(); $('app').classList.add('hide'); $('login').classList.remove('hide'); $('loginPw').value = ''; };

function switchView(view) { const u = new URL(location.href); u.searchParams.set('view', view); location.href = u.toString(); }

/* ── Actions ───────────────────────────────────────────── */
const formData = form => Object.fromEntries(new FormData(form));
const ACTIONS = {
  'nav': d => { Overlay.close(); navigate(d.tab); },
  'back': () => navigate('more'),
  'logout': () => confirmBox('로그아웃할까요?', () => signOut(), 'Sign out'),
  'refresh': async () => { await sync(); render(false); },
  'switch-view': d => switchView(d.view),
  'close-overlay': () => Overlay.close(),
  'close-dialog': () => closeDialog(),
  'confirm-ok': async () => { const fn = pendingConfirm; pendingConfirm = null; closeDialog(); if (fn) await fn(); },
  'set-week': d => setWeek(d.week),
  /* mail */
  'mailbox': d => { ui.mailbox = d.box; ui.selectedMail = null; render(false); },
  'mail-open': d => { if (VIEW === 'mobile') openMailMobile(d.id); else { ui.selectedMail = d.id; render(false); } },
  'mail-del': async d => {
    if (d.mode === 'purge') return confirmBox('이 메일을 내 휴지통에서 영구 삭제할까요? (상대방 메일함에는 남습니다)', async () => { await setMailDeleted(d.id, 'purge'); Overlay.close(); }, '영구 삭제');
    await setMailDeleted(d.id, d.mode); if (VIEW === 'mobile') Overlay.close(); else ui.selectedMail = null; render(false);
  },
  'compose': d => openCompose({ reply: d.reply, all: d.all, to: d.to, subject: d.subject, mission: d.mission }),
  'pick-recipient': (d) => { const f = $('overlayBody').querySelector(`[name="${d.field}"]`); if (!f) return; if (d.field === 'cc') { const list2 = parseAddressList(f.value); if (!list2.includes(d.email)) list2.push(d.email); f.value = list2.join(', '); } else f.value = d.email; },
  'assess-email': () => {
    const form = $('overlayBody').querySelector('form[data-form="compose"]'); if (!form) return;
    const f = readCompose(form);
    const input = assessmentInput({ to: f.to, subject: f.subject, body: f.body, missionId: f.missionId, emailType: f.emailType });
    const result = AssessEngine.assessEmail(input);
    const prev = ui.compose.history[ui.compose.history.length - 1];
    ui.compose.history.push(result);
    $('assessPanel').innerHTML = renderAssessment(result, prev);
    $('assessBtn').textContent = '↻ Revise & Reassess';
    $('assessPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    recordAssessment({ result, input, missionId: f.missionId, draftKey: ui.compose.draftKey, final: false }).catch(e => console.warn('save assessment', e));
  },
  'assess-view': d => openAssessmentRecord(d.id),
  /* chat */
  'chat-open': d => openChat(d.npc),
  /* items */
  'item-new': d => openItemForm({ kind: d.kind || 'request' }),
  'item-open': d => openItem(d.id),
  'item-edit': d => openItemForm({}, d.id),
  'item-act': async d => { if (d.a === 'delete') return confirmBox('이 Draft를 삭제할까요?', async () => { await transitionItem(d.id, 'delete'); Overlay.close(); }, '삭제'); },
  'coord-report': () => openItemForm(coordinatorStatusDraft()),
  /* deliverables */
  'deliv-open': d => openDeliverable(d.key),
  'deliv-scope': d => { ui.delivScope = d.scope; render(false); },
  /* meetings */
  'meeting-new': d => openMeetingForm(null, d.week),
  'meeting-open': d => openMeeting(d.id),
  'meeting-edit': d => openMeetingForm(d.id),
  'meeting-delete': d => confirmBox('이 회의 기록을 삭제할까요?', async () => { await deleteMeeting(d.id); Overlay.close(); }, '삭제'),
  'action-toggle': async d => { await toggleAction(d.meeting, Number(d.idx)); if (Overlay.isOpen && meetingById(d.meeting) && $('overlayTitle').textContent === meetingById(d.meeting).title) openMeeting(d.meeting); },
  'row-add': d => { $('dyn-' + d.kind).insertAdjacentHTML('beforeend', dynRow(d.kind)); },
  'row-del': (d, el) => el.closest('.dyn-row').remove(),
  /* scenario */
  'event-preview': d => { const e = project().events.find(x => x.key === d.key); Overlay.open(e.subject, `<div class="mail-head">W${e.week} · From ${esc(displayName(e.from))} → ${esc(e.to)}</div><div class="mail-body">${esc(e.body)}</div>`); },
  'event-send': async d => { const n = await sendEvent(d.key); alertBox(n ? `참가자 ${n}명의 받은편지함에 전달했습니다.` : '대상 참가자 모두 이미 받았습니다.'); },
  /* projects */
  'project-open': d => { setActiveProject(d.id); },
  'project-xlsx': async d => downloadProjectXlsx(projectById(d.id)),
  'project-delete': d => confirmBox('이 프로젝트를 삭제할까요? (기록은 남고 목록에서 사라집니다)', () => deleteProject(d.id), '삭제'),
  'import-confirm': async () => { if (!pendingImport) return; const p = pendingImport; pendingImport = null; await saveProject(p); Overlay.close(); ui.tab = 'projects'; render(); alertBox(`“${p.name}” 프로젝트가 준비되었습니다. 이제 Accounts에서 역할별 계정을 배정하세요.`); },
  /* accounts */
  'account-new': d => openAccountForm(null, d.role),
  'account-edit': d => openAccountForm(d.id),
  'account-toggle': async d => { await toggleAccount(d.id); Overlay.close(); },
  'account-delete': d => { const a = db.accounts.find(x => x.id === d.id); confirmBox(`${a.name} (${a.loginId}) 계정을 삭제할까요? 기록은 남습니다.`, async () => { await deleteAccount(d.id); Overlay.close(); }, '삭제'); },
  'export': () => exportData(),
  'po-new': () => openPurchaseForm(),
  'po-pay': d => walletOp('pay', { purchaseId: d.id, opId: 'pay-' + d.id }),
  'po-cancel': d => confirmBox('이 구매를 취소하고 예약된 금액을 돌려받을까요?', () => walletOp('cancel', { purchaseId: d.id, opId: 'cancel-' + d.id }), '구매 취소'),
  'xfer-new': () => openTransferForm(),
  'xfer-run': async d => { await walletOp('transfer', { itemId: d.id, opId: 'xfer-' + d.id }); openItem(d.id); },
  'file-download': d => downloadFile(d.id, d.name)
};

const FORMS = {
  'login': async () => {
    $('loginError').textContent = '로그인 중...';
    if (!lastSync) { try { await sync(); } catch (e) { console.warn(e); } }
    if (!signIn($('loginId').value, $('loginPw').value)) { $('loginError').textContent = '아이디 또는 비밀번호를 확인하세요.'; return; }
    $('loginError').textContent = ''; showApp();
  },
  'compose': async (form) => {
    const f = readCompose(form);
    const input = assessmentInput({ to: f.to, subject: f.subject, body: f.body, missionId: f.missionId, emailType: f.emailType });
    const draftKey = ui.compose?.draftKey || uid();
    const id = await sendMail({ to: f.to, cc: f.cc, subject: f.subject, body: f.body, thread: f.thread, missionId: f.missionId });
    const result = AssessEngine.assessEmail(input);
    await recordAssessment({ result, input, missionId: f.missionId, draftKey, mailId: id, final: true }).catch(e => console.warn('final assessment', e));
    Overlay.close(); ui.mailbox = 'sent'; ui.selectedMail = id;
    if (ui.tab !== 'mail') navigate('mail'); else render(false);
    alertBox(`메일을 보냈습니다.\n규칙 기반 평가: ${result.score}/100 · ${result.grade}`);
  },
  'chat-send': async form => { const t = form.text.value; form.text.value = ''; await sendChat(form.dataset.npc, t); },
  'item-save': async (form, submitter) => { const f = formData(form); await saveItem(f, submitter?.value === 'submit', form.dataset.id || null); Overlay.close(); },
  'item-act': async (form, submitter) => { await transitionItem(form.dataset.id, submitter?.value, form.note.value); Overlay.close(); },
  'deliv-save': async (form, submitter) => {
    const f = formData(form); const file = form.file?.files?.[0];
    let up = null; if (file) up = await uploadFile(file);
    await saveDeliverableVersion(form.dataset.key, { content: f.content, link: f.link, note: f.note, fileId: up?.id, fileName: up?.name }, submitter?.value === 'submit');
    openDeliverable(form.dataset.key);
  },
  'deliv-review': async (form, submitter) => { await reviewDeliverable(form.dataset.key, submitter?.value, form.note.value); openDeliverable(form.dataset.key); },
  'meeting-save': async form => {
    const fd = new FormData(form);
    const rows = kind => [...form.querySelectorAll(`.dyn-row[data-kind="${kind}"]`)].map(r => ({ text: r.querySelector(`[name="${kind}_text"]`).value.trim(), owner: r.querySelector(`[name="${kind}_owner"]`).value, due: r.querySelector(`[name="${kind}_due"]`).value, ...(kind === 'act' ? { done: r.querySelector('input[type=checkbox]').checked } : {}) })).filter(x => x.text);
    const att = fd.getAll('att'), spoke = new Set(fd.getAll('spoke')), asked = new Set(fd.getAll('asked'));
    const participation = Object.fromEntries(att.map(id => [id, { spoke: spoke.has(id), asked: asked.has(id) }]));
    const m = await saveMeeting({ id: form.dataset.id || undefined, week: Number(fd.get('week')), date: fd.get('date'), title: fd.get('title'), agenda: fd.get('agenda'), attendees: att, participation, minutes: fd.get('minutes'), decisions: rows('dec'), actions: rows('act'), status: fd.get('status') });
    openMeeting(m.id);
  },
  'eval-save': async form => { const f = formData(form); const scores = Object.fromEntries(evalDims().map(d => [d.dimension, Number(f[d.dimension])])); await saveEvaluation(form.dataset.user, scores, f.evidence); alertBox('평가를 저장했습니다.'); },
  'week': form => setWeek(formData(form).week),
  'po-save': async form => { const f = formData(form); const sh = stakeholderByEmail(f.vendorEmail); await walletOp('purchase', { wallet: myWalletKey(), vendorEmail: f.vendorEmail, vendorName: sh ? `${sh.name} · ${sh.company}` : '', item: f.item, qty: Number(String(f.qty).replace(/[^\d.]/g, '')) || 0, unitPrice: Number(String(f.unitPrice).replace(/[^\d.]/g, '')) || 0, total: f.total ? Number(String(f.total).replace(/[^\d.]/g, '')) : '', payDate: f.payDate, reason: f.reason }); Overlay.close(); alertBox('예산이 예약(Committed)되었습니다. 공급업체에 주문 메일을 보내면 이 구매 기록이 발주서(PO)로 인정됩니다.'); },
  'wallet-allocate': async form => { const f = formData(form); const num = v => Number(String(v).replace(/[^\d.-]/g, '')); const allocations = Object.fromEntries(walletKeys().map(k => [k, num(f['alloc_' + k])])); await walletOp('allocate', { allocations, budget: num(f.budget), memo: f.memo }); alertBox('예산 배정을 저장했습니다.'); },
  'wallet-correction': async form => { const f = formData(form); await walletOp('correction', { wallet: f.wallet, amount: Number(String(f.amount).replace(/[^\d.-]/g, '')), memo: f.memo }); alertBox('정정 거래를 추가했습니다.'); },
  'account-create': async form => { const r = await createAccount(formData(form)); Overlay.close(); alertBox(`로그인 ID: ${r.loginId}\n비밀번호: ${r.password}\n업무 이메일: ${r.email}\n역할: ${roleTitle(r.role, projectById(r.projectId))}`, '계정을 만들었습니다'); },
  'account-update': async form => { await updateAccount(form.dataset.id, formData(form)); Overlay.close(); }
};

const CHANGES = {
  'project': el => setActiveProject(el.value),
  'deliv-week': el => { ui.delivWeek = el.value ? Number(el.value) : 0; render(false); },
  'eval-user': el => { ui.evalUser = el.value; $('evalForm').innerHTML = evalForm(el.value); },
  'acct-project': el => { $('acctRole').innerHTML = roleOptions(projectById(el.value)); },
  'compose-mission': el => { $('missionHint').innerHTML = missionHint(missionById(el.value)); },
  'xlsx-file': el => handleXlsx(el.files[0]).finally(() => { el.value = ''; })
};

function reportError(e) { console.error(e); alertBox(e.message || String(e), '오류'); }
function bindEvents() {
  document.addEventListener('click', async e => {
    if (e.target === $('overlay')) return Overlay.close();
    const el = e.target.closest('[data-act]'); if (!el) return;
    const fn = ACTIONS[el.dataset.act]; if (!fn) return;
    e.preventDefault(); if (el.disabled) return;
    el.disabled = true;
    try { await fn(el.dataset, el); } catch (err) { reportError(err); } finally { el.disabled = false; }
  });
  document.addEventListener('submit', async e => {
    const form = e.target.closest('form[data-form]'); if (!form) return;
    e.preventDefault();
    const fn = FORMS[form.dataset.form]; if (!fn) return;
    const errBox = form.dataset.form === 'login' ? $('loginError') : form.querySelector('[data-error]');
    if (errBox && form.dataset.form !== 'login') errBox.textContent = '';
    const btns = form.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
    try { await fn(form, e.submitter); } catch (err) { if (errBox) { errBox.textContent = err.message; errBox.scrollIntoView({ block: 'nearest' }); } else reportError(err); } finally { btns.forEach(b => b.disabled = false); }
  });
  document.addEventListener('change', async e => { const el = e.target.closest('[data-change]'); if (!el) return; try { await CHANGES[el.dataset.change]?.(el); } catch (err) { reportError(err); } });
  document.addEventListener('input', e => { if (e.target.dataset?.calc === 'po') { const f = e.target.form; const q = Number(String(f.qty.value).replace(/[^\d.]/g, '')), u = Number(String(f.unitPrice.value).replace(/[^\d.]/g, '')); if (q && u) f.total.value = Math.round(q * u); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('dialog').classList.contains('hide')) closeDialog(); else if (Overlay.isOpen) Overlay.close(); } });
  // Excel drag & drop (Projects 화면 + Director는 어디에 드롭해도 인식)
  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { if (!me || !isDirector() || !e.dataTransfer?.types?.includes('Files')) return; e.preventDefault(); document.body.classList.add('dragging'); }));
  ['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { if (t === 'dragleave' && e.relatedTarget) return; document.body.classList.remove('dragging'); }));
  document.addEventListener('drop', e => {
    if (!me || !isDirector()) return;
    const file = [...(e.dataTransfer?.files || [])].find(f => /\.(xlsx|xlsm|xls)$/i.test(f.name));
    if (!file) return;
    e.preventDefault();
    handleXlsx(file).catch(reportError);
  });
}

/* ── Boot ──────────────────────────────────────────────── */
function detectView() {
  const q = new URLSearchParams(location.search).get('view');
  if (q === 'pc' || q === 'mobile') return q;
  const ua = navigator.userAgent;
  if (/iPad|Tablet/i.test(ua)) return 'pc';
  if (/iPhone|iPod|Android.+Mobile|Windows Phone|Mobile Safari|SamsungBrowser.+Mobile/i.test(ua)) return 'mobile';
  const shortSide = Math.min(screen.width, screen.height);
  const touch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
  return touch && shortSide <= 600 ? 'mobile' : 'pc';
}
(function start() {
  VIEW = detectView();
  document.documentElement.dataset.view = VIEW;
  document.title = VIEW === 'mobile' ? 'Worqend · Mobile' : 'Worqend · Workspace';
  document.body.appendChild(document.getElementById('tpl-' + VIEW).content.cloneNode(true));
  Shell = VIEW === 'mobile' ? MobileShell : PCShell;
  bindEvents();
  boot().then(u => { if (u) showApp(); }).catch(e => { console.error(e); $('loginError').textContent = '데이터 서버 연결 실패: ' + e.message; });
})();

</script>
